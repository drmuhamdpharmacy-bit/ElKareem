<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f3f6fa;--bg2:#ffffff;--bg3:#f1f5f9;--bg4:#e2e8f0;
  --accent:#1d4ed8;--accent2:#1e40af;--accent3:#1d4ed8;
  --brand:#15803d;
  --gold:#f59e0b;--gold2:#b45309;--gold3:#92400e;
  --success:#15803d;--success2:#dcfce7;
  --danger:#dc2626;--danger2:#fee2e2;
  --warn:#d97706;--warn2:#fef3c7;
  --purple:#7c3aed;--pink:#db2777;
  --text:#0f172a;--text2:#475569;--text3:#64748b;
  --border:#e2e8f0;--border2:#cbd5e1;
  --card:#ffffff;--card2:#f8fafc;
  --radius:14px;--radius2:9px;--radius3:6px;
  --shadow:0 10px 30px rgba(15,23,42,.10);
  --shadow2:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --glow:0 6px 18px rgba(29,78,216,.10);
}
body{-webkit-font-smoothing:antialiased;font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:14px}

/* ── SIDEBAR ── */
.sidebar{width:230px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;right:0;height:100vh;overflow-y:auto;z-index:100;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.sidebar.closed{transform:translateX(230px)}
.sidebar-logo{padding:16px 16px 12px;border-bottom:1px solid var(--border);background:#fff}
.sidebar-logo img{max-width:170px;max-height:96px;object-fit:contain;display:block;margin:0 auto 6px}
.sidebar-logo .branch-badge{font-size:10px;color:var(--accent3);text-align:center;background:rgba(59,110,245,.12);border:1px solid rgba(59,110,245,.25);border-radius:20px;padding:2px 10px;display:inline-block;margin:0 auto;display:block;width:fit-content}
.user-badge{padding:12px 14px;border-bottom:1px solid var(--border);background:var(--card2);display:flex;align-items:center;gap:10px}
.user-avatar{width:36px;height:36px;border-radius:50%;color:#fff;background:linear-gradient(135deg,var(--accent),var(--brand));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
.user-info .role-badge{font-size:9px;background:var(--accent);color:#fff;padding:2px 7px;border-radius:20px;display:inline-block;margin-bottom:2px}
.user-info .uname{font-size:13px;font-weight:700;line-height:1.2}
.nav-group{padding:6px 0}
.nav-label{font-size:9px;color:var(--text3);padding:8px 16px 4px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;border-right:3px solid transparent;transition:all .15s;color:var(--text2);font-size:13px;font-weight:500;position:relative}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:rgba(21,128,61,.09);border-right-color:var(--brand);color:var(--brand);font-weight:700}
.nav-item .badge-dot{background:var(--danger);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;margin-right:auto}
.nav-icon{width:22px;text-align:center;font-size:15px}
.sidebar-footer{padding:14px;margin-top:auto;border-top:1px solid var(--border)}

/* ── MAIN ── */
.main{margin-right:230px;display:flex;flex-direction:column;min-height:100vh;transition:margin .3s}
.main.full{margin-right:0}

/* ── TOPBAR ── */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;backdrop-filter:blur(10px)}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar h2{font-size:17px;font-weight:800}
.topbar-right{display:flex;gap:8px;align-items:center}
.sync-indicator{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);padding:4px 10px;border-radius:20px;background:var(--bg3);border:1px solid var(--border)}
.sync-indicator.live{color:var(--success)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text3)}
.sync-indicator.live .sync-dot{background:var(--success);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.content{padding:20px 24px;flex:1}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow2)}
.card-sm{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px}
.stat-card{background:var(--card);box-shadow:var(--shadow2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--glow)}
.stat-card::before{content:'';position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--accent));pointer-events:none}
.stat-card .sc-icon{font-size:28px;margin-bottom:8px;display:block}
.stat-card .sc-label{font-size:11px;color:var(--text2);font-weight:600;margin-bottom:4px}
.stat-card .sc-val{font-size:22px;font-weight:800;line-height:1}
.stat-card .sc-sub{font-size:11px;color:var(--text3);margin-top:4px}

/* ── GRIDS ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1100px){.grid-4{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:900px){.grid-4{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}}
@media(max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.sidebar{transform:translateX(230px)}.sidebar.open{transform:translateX(0)}.main{margin-right:0}.content{padding:14px}}

/* ── TABLES ── */
.table-wrap{overflow-x:auto;border-radius:var(--radius2);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg3);padding:10px 14px;text-align:right;color:var(--text2);font-weight:700;font-size:11px;border-bottom:1px solid var(--border);white-space:nowrap;letter-spacing:.3px}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(29,78,216,.03)}
.table-footer td{background:var(--bg3);font-weight:800;border-top:2px solid var(--border2)}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-blue{background:rgba(59,110,245,.2);color:#1d4ed8}
.badge-green{background:rgba(16,185,129,.2);color:#15803d}
.badge-gold{background:rgba(245,166,35,.2);color:#b45309}
.badge-red{background:rgba(239,68,68,.2);color:#dc2626}
.badge-gray{background:rgba(100,116,139,.12);color:#475569}
.badge-purple{background:rgba(139,92,246,.2);color:#6d28d9}
.badge-pink{background:rgba(236,72,153,.2);color:#be185d}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius2);font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 2px 12px rgba(59,110,245,.3)}
.btn-primary:hover{box-shadow:0 4px 20px rgba(59,110,245,.5)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{background:var(--bg3);color:var(--text);border-color:var(--border2)}
.btn-danger{background:rgba(239,68,68,.12);color:#dc2626;border:1px solid rgba(239,68,68,.25)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-success{background:rgba(16,185,129,.12);color:#15803d;border:1px solid rgba(16,185,129,.25)}
.btn-success:hover{background:rgba(16,185,129,.2)}
.btn-gold{background:rgba(245,166,35,.12);color:#b45309;border:1px solid rgba(245,166,35,.25)}
.btn-gold:hover{background:rgba(245,166,35,.2)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-xs{padding:3px 9px;font-size:11px}

/* ── FORMS ── */
input,select,textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius2);color:var(--text);font-family:'Tajawal',sans-serif;font-size:13px;padding:9px 12px;width:100%;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,110,245,.15)}
select option{background:var(--bg2)}
label{font-size:12px;color:var(--text2);font-weight:700;display:block;margin-bottom:5px}
.form-group{margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── LOGIN ── */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,rgba(21,128,61,.10),transparent 60%),radial-gradient(ellipse at 50% 100%,rgba(29,78,216,.08),transparent 60%),var(--bg);padding:20px}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:44px;width:100%;max-width:420px;box-shadow:var(--shadow)}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo img{max-width:260px;max-height:150px;object-fit:contain;margin-bottom:10px}
.login-logo h2{font-size:14px;color:var(--text2);font-weight:500}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:26px;width:100%;max-width:620px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.modal-header h3{font-size:16px;font-weight:800}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;padding:2px;line-height:1;transition:color .15s}
.modal-close:hover{color:var(--text)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}

/* ── NOTIF BARS ── */
.notif-bar{padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:600;border-bottom:1px solid;animation:slideDown .2s ease}
@keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
.notif-bar.type-owner{background:rgba(59,110,245,.1);border-color:rgba(59,110,245,.3);color:var(--accent3)}
.notif-bar.type-success{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3);color:#15803d}
.notif-bar.type-warn{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#dc2626}
.notif-bar.type-gold{background:rgba(245,166,35,.1);border-color:rgba(245,166,35,.3);color:var(--gold2)}
.notif-close{margin-right:auto;background:none;border:none;color:inherit;cursor:pointer;font-size:18px;opacity:.7;transition:opacity .15s}
.notif-close:hover{opacity:1}

/* ── KPI ── */
.kpi-bar{background:var(--bg4);border-radius:8px;overflow:hidden;height:7px}
.kpi-fill{height:100%;border-radius:8px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.score-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;width:96px;height:96px;border-radius:50%;border:5px solid;font-size:26px;font-weight:800}

/* ── TOGGLE ── */
.toggle-switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--bg4);border-radius:24px;transition:.2s;border:1px solid var(--border2)}
.toggle-slider:before{position:absolute;content:'';height:16px;width:16px;right:3px;bottom:3px;background:var(--text3);border-radius:50%;transition:.2s}
.toggle-switch input:checked+.toggle-slider{background:var(--success);border-color:var(--success)}
.toggle-switch input:checked+.toggle-slider:before{transform:translateX(-20px);background:#fff}

/* ── SECTION HEADER ── */
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.section-header h3{font-size:15px;font-weight:800}

/* ── IMG UPLOAD ── */
.img-upload-area{border:2px dashed var(--border2);border-radius:var(--radius2);padding:22px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text2)}
.img-upload-area:hover{border-color:var(--accent);background:rgba(59,110,245,.05)}

/* ── HAMBURGER ── */
.hamburger{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px}
@media(max-width:640px){.hamburger{display:block}
  .topbar{flex-wrap:wrap;gap:8px;padding:10px 12px}
  .topbar-left{width:100%}
  .topbar-right{width:100%;flex-wrap:wrap;gap:6px}
  .topbar-right .badge,.branch-sel{max-width:100%!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 100%}
  .topbar-right select{flex:1}}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:24px;z-index:999;display:flex;align-items:center;gap:10px;padding:13px 20px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:var(--shadow);animation:toastIn .25s ease;max-width:340px}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast-success{background:#dcfce7;color:#15803d;border:1px solid rgba(16,185,129,.3)}
.toast-error{background:#fee2e2;color:#991b1b;border:1px solid rgba(239,68,68,.3)}
.toast-info{background:#dbeafe;color:#1d4ed8;border:1px solid rgba(59,130,246,.3)}

/* ── KIOSK / CHECK-IN / DAILY ── */
.kiosk-wrap{display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:start}
@media(max-width:900px){.kiosk-wrap{grid-template-columns:1fr}}
.kiosk-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:28px;text-align:center;box-shadow:var(--shadow2)}
.kiosk-qr{margin:18px auto;max-width:420px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:40px}
.kiosk-qr svg{width:100%;height:auto}
.kiosk-row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.kiosk-page{min-height:100vh;padding:24px;background:var(--bg)}
.checkin-result{text-align:center;padding:30px;margin-bottom:16px}
.checkin-result .btn{white-space:normal;text-align:center;line-height:1.5}
.day-flags td{padding-top:0;border-top:none}
.day-flags .btn,.day-flags .badge{margin:2px 0}
.daily-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media(max-width:640px){.daily-grid{grid-template-columns:repeat(3,1fr)}}
.branch-sel{width:auto!important;max-width:280px;font-weight:700;color:var(--brand);border-color:rgba(21,128,61,.35)}

/* ── PRINT ── */
@media print{
  .sidebar,.topbar,.topbar-right,.hamburger,.notif-bar,.no-print{display:none!important}
  .main{margin-right:0!important}
  .content{padding:0!important}
  body{background:#fff;color:#000}
  .card,.card-sm,.stat-card{background:#fff!important;border:1px solid #ddd!important;box-shadow:none!important}
  th{background:#f5f5f5!important;color:#333!important}
  td{color:#333!important}
}

/* ── SETUP SCREEN ── */
.setup-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);padding:20px}
.setup-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:40px;width:100%;max-width:560px;box-shadow:var(--shadow)}
.setup-card h2{font-size:22px;font-weight:800;margin-bottom:6px;color:var(--gold2)}
.setup-card .step{display:flex;gap:12px;align-items:flex-start;margin-bottom:20px;padding:14px;background:var(--bg3);border-radius:var(--radius2);border:1px solid var(--border)}
.setup-card .step-num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.setup-card code{background:var(--bg4);padding:2px 7px;border-radius:4px;font-family:monospace;font-size:12px;color:var(--accent3)}

/* ── PROGRESS BAR ── */
.progress-bar{background:var(--bg4);border-radius:8px;overflow:hidden;height:10px;margin-top:6px}
.progress-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .6s}

/* ── PERM ITEM ── */
.perm-item{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:12px;cursor:pointer;transition:all .15s}
.perm-item.on{border-color:var(--accent);background:rgba(59,110,245,.08);color:var(--text)}
.perm-item input{width:auto;margin:0}

/* ── LEADERBOARD PODIUM ── */
.podium-card{background:var(--bg3);border:2px solid var(--border2);border-radius:16px;padding:20px 14px;text-align:center;transition:all .2s;position:relative}
.podium-card.rank-1{border-color:var(--gold);box-shadow:0 0 24px rgba(245,166,35,.2)}
.podium-card.rank-2{border-color:#94a3b8}
.podium-card.rank-3{border-color:#92400e}

/* ── INLINE STATS ROW ── */
.stats-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.stats-row-item{flex:1;min-width:80px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:10px;text-align:center}
.stats-row-item .val{font-size:18px;font-weight:800}
.stats-row-item .lbl{font-size:10px;color:var(--text3);margin-top:2px}

/* ── SHIFT PLANNER ── */
.shift-grid{display:grid;grid-template-columns:160px repeat(7,1fr);gap:1px;background:var(--border)}
.shift-cell{background:var(--bg2);padding:8px 6px;text-align:center;font-size:11px}
.shift-cell.header{background:var(--bg3);font-weight:700;color:var(--text2);font-size:10px}
.shift-cell.emp-name{text-align:right;font-weight:600;padding-right:12px}
.shift-block{border-radius:6px;padding:3px 6px;font-size:10px;font-weight:700;cursor:pointer;transition:opacity .15s}
.shift-block:hover{opacity:.8}
.shift-am{background:rgba(59,110,245,.25);color:#1d4ed8}
.shift-pm{background:rgba(245,166,35,.25);color:#92400e}
.shift-off{background:rgba(100,116,139,.10);color:var(--text3)}
.shift-split{background:rgba(16,185,129,.25);color:#15803d}
@media(max-width:420px){.top-logout-label{display:none}}
</style>

// Commission tiers per quarter: from "min" sales upward, the WHOLE month's sales get "rate"%.
// Editable by the owner in Settings → شرائح العمولة.
const COMM_TIERS_DEF={
  Q1:[{min:662400,rate:0.5},{min:691000,rate:1},{min:760000,rate:1.5},{min:840000,rate:2}],
  Q2:[{min:662400,rate:0.5},{min:691000,rate:1},{min:760000,rate:1.5},{min:840000,rate:2}],
  Q3:[{min:841000,rate:1},{min:900000,rate:1.5},{min:960000,rate:2}],
  Q4:[{min:841000,rate:1},{min:900000,rate:1.5},{min:960000,rate:2}]
};
function quarterOf(mk){return monthToQuarter(+String(mk).split('-')[1])}
function getTiers(mk=monthKey()){
  const t=(commissionTiers&&commissionTiers[quarterOf(mk)])||COMM_TIERS_DEF[quarterOf(mk)]||[];
  return t.filter(x=>x&&+x.min>0&&+x.rate>0).map(x=>({min:+x.min,rate:+x.rate})).sort((a,b)=>a.min-b.min);
}
// Commission can be switched off per branch (Settings ← شرائح العمولة); the tiers are kept.
function commOn(){return!(commissionTiers&&commissionTiers.off)}
function calcCommission(sales,mk=monthKey()){
  if(!commOn())return{rate:0,pool:0,label:'العمولة متوقفة لهذا الفرع',off:true};
  const tiers=getTiers(mk);let hit=null;
  tiers.forEach(t=>{if(sales>=t.min)hit=t});
  if(!hit)return{rate:0,pool:0,label:'أقل من حد العمولة'};
  const i=tiers.indexOf(hit),names=['مبيعات عند الحد','مبيعات جيدة','مبيعات عالية','مبيعات ممتازة'];
  const name=i===tiers.length-1?'مبيعات ممتازة':(names[i]||'مبيعات جيدة');
  return{rate:hit.rate,pool:sales*hit.rate/100,label:`${name} (${hit.rate}%)`};
}
function commThreshold(mk=monthKey()){const t=getTiers(mk);return t.length?t[0].min:Infinity}

function daysText(d){const t=DAY_TIERS.find(x=>x[0]===+d);return t?t[1]:`${fmtNum(d,1)} يوم`}

function dayPen(empId,mk){let days=0,amt=0;(penalties[mk]||[]).forEach(x=>{if(x.empId===empId&&x.days){days+=+x.days;amt+=+x.amount}});return{days:Math.round(days*100)/100,amt:Math.round(amt*100)/100}}

// signed amount: «+923» / «-100.00», and plain «0» when there is nothing
function sgn(v,sign,dec=0){return v>0?'\u200E'+sign+fmtNum(v,dec):fmtNum(0,dec)}
function fmtNum(n,dec=0){const s=Number(n||0).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});return s[0]==='-'?'\u200E'+s:s}
function monthToQuarter(m){if(m<=2)return'Q1';if(m<=5)return'Q2';if(m<=8)return'Q3';return'Q4'}
function monthKey(){return`${state.year}-${state.month}`}
// ══ PAY MONTH ══ Salaries run from the 26th of the previous month to the 25th, and the period is named
// after the month it ends in (26 Oct → 25 Nov = November). Hours, lateness and forgotten check-outs follow it.
const PAY_START_DAY=26;
function payPeriod(y=state.year,m=state.month){
  const iso=d=>d.toISOString().slice(0,10);
  if(PAY_START_DAY<=1)return{from:iso(new Date(Date.UTC(y,m,1))),to:iso(new Date(Date.UTC(y,m+1,0)))};
  return{from:iso(new Date(Date.UTC(y,m-1,PAY_START_DAY))),to:iso(new Date(Date.UTC(y,m,PAY_START_DAY-1)))};
}
function payMonthOf(dateStr){const[y,m,d]=String(dateStr).slice(0,10).split('-').map(Number);const dt=new Date(Date.UTC(y,m-1+(PAY_START_DAY>1&&d>=PAY_START_DAY?1:0),1));return{y:dt.getUTCFullYear(),m:dt.getUTCMonth()}}
function payMonthKeyOf(dateStr){const p=payMonthOf(dateStr);return`${p.y}-${p.m}`}
function payRangeLabel(y=state.year,m=state.month){const p=payPeriod(y,m),f=x=>{const[,mm,dd]=x.split('-');return`${+dd}/${+mm}`};return`${f(p.from)} – ${f(p.to)}`}
const payRangeHTML=()=>`<span style="font-size:12px;color:var(--text3);font-weight:500"> (${payRangeLabel()})</span>`;
// Hours: employees who check in with the QR code get their hours calculated automatically;
// the manual number is only used for employees/months without check-ins.
function getMonthData(mk=monthKey()){
  const d=monthlyData[mk]||{},hours={...(d.hours||{})},rows=attRowsFor(state.branch,mk);
  if(rows){const by={};rows.forEach(r=>{by[r.emp_id]=(by[r.emp_id]||0)+(r.minutes||0)});Object.entries(by).forEach(([id,m])=>{hours[id]=Math.round(m/60*100)/100})}
  return{sales:0,gp:0,np:0,...d,hours,empSales:d.empSales||{}};
}
// ══ AUTOMATIC ATTENDANCE (from QR check-ins) ══
let attDays={};   // {'b1|2026':[{emp_id,day,first_in,last_out,minutes,forgot,fixed,open,forgot_in}]}
let _attMemo={};
const CFG_DEF={grace:10,shift:8,free_forgets:2,forget_penalty:0.5};
function branchCfg(b=state.branch){
  const br=branches.find(x=>x.id===b)||(myView?.emp?.cfg)||{},out={...CFG_DEF};
  Object.keys(CFG_DEF).forEach(k=>{if(br[k]!==undefined&&br[k]!==null&&br[k]!=='')out[k]=+br[k]});
  return out;
}
async function loadAttDays(b=state.branch,year=state.year){
  const emp=isStaff()?null:state.user.empId;
  const first=payPeriod(year,0).from,last=payPeriod(year,11).to,[fy,fm,fd]=first.split('-').map(Number),[ly,lm,ld]=last.split('-').map(Number);
  const{data,error}=await sb.rpc('attendance_days',{p_branch:b,p_from:new Date(Date.UTC(fy,fm-1,fd)-4*3600e3).toISOString(),p_to:new Date(Date.UTC(ly,lm-1,ld+1)).toISOString(),p_emp:emp});
  if(error)throw error;
  attDays[`${b}|${year}`]=(data||[]).filter(r=>payMonthOf(r.day).y===year);_attMemo={};
  return data;
}
async function ensureAtt(force){
  if(!state.user||isKiosk())return;
  const bs=isStaff()?Object.keys(branchData):[state.user.branch,...Object.keys(myOtherViews||{})];
  await Promise.all(bs.filter(b=>force||!attDays[`${b}|${state.year}`]).map(b=>loadAttDays(b,state.year).catch(e=>console.warn('attendance',e))));
}
function attRowsFor(b,mk){
  const k=b+'|'+mk;if(k in _attMemo)return _attMemo[k];
  const[y,m]=mk.split('-').map(Number),rows=attDays[`${b}|${y}`];
  return(_attMemo[k]=rows?rows.filter(r=>payMonthKeyOf(r.day)===mk):null);
}
// ── Lateness excuses («إذن تأخير»): a late day with an approved excuse does not count as late. Max LATE_MAX per pay month; warning above LATE_WARN.
const LATE_KIND='إذن تأخير',LATE_MAX=15,LATE_WARN=2; // up to 15 per month; above 2 the supervisor/owner is warned before approving
function mdOf(b){return b===state.branch?monthlyData:((branchData[b]||{}).monthly_data||{})}
function excusesOf(empId,mk,b=state.branch){
  if(isStaff())return((mdOf(b)[mk]||{}).lateExcuse||{})[empId]||[];
  const v=(myView&&b!==myView.emp?.branch&&myOtherViews?.[b])||myView;return(v?.months?.[mk]?.lateExcused)||[];
}
// ── Days without lateness for the whole branch (owner): e.g. the first day of the new system.
// Nobody's lateness counts that day, and it does not use anyone's monthly «إذن تأخير».
function lateFreeOf(mk,b=state.branch){
  if(isStaff())return(mdOf(b)[mk]||{}).lateFree||[];
  const v=(myView&&b!==myView.emp?.branch&&myOtherViews?.[b])||myView;return(v?.months?.[mk]?.lateFree)||[];
}
function autoAtt(empId,mk,b=state.branch,emp){
  const rows=attRowsFor(b,mk);if(!rows)return null;
  const mine=rows.filter(r=>r.emp_id===empId);if(!mine.length)return null;
  const e=emp||employees.find(x=>x.id===empId)||{},cfg=branchCfg(b),exc=new Set(excusesOf(empId,mk,b).map(x=>x.date)),free=new Set(lateFreeOf(mk,b).map(x=>x.date));
  let late=0,lm=0,mins=0,forgot=0,fixed=0,open=0,excused=0;const excDays=new Set(),freeDays=new Set();
  mine.forEach(r=>{mins+=r.minutes||0;forgot+=r.forgot||0;fixed+=r.fixed||0;open+=r.open||0;const x=lateMinutesFor(r.first_in,e.scheduledTime,cfg.grace);if(x){if(free.has(r.day))freeDays.add(r.day);else if(exc.has(r.day)){excused++;excDays.add(r.day)}else{late++;lm+=x}}});
  return{days:mine.length,late,lateMin:lm,excused,excDays,freeDays,mins,hrs:Math.round(mins/60*100)/100,forgot,fixed,open,rows:mine.sort((a,b)=>a.day<b.day?-1:1)};
}
// Forgotten check-outs: the first `free_forgets` per month are free, each extra one costs `forget_penalty` of a normal day's pay.
function forgotPenalty(emp,a,cfg,waived){
  const count=a?(a.forgot+a.fixed):0,extra=Math.max(0,count-cfg.free_forgets);
  const per=Math.round(((+emp.hourRate||0)/26)*cfg.shift*cfg.forget_penalty*100)/100;
  return{count,extra,per,amount:waived?0:Math.round(extra*per*100)/100,waived:!!waived};
}
function isWaived(empId,mk){return!!(((monthlyData[mk]||{}).forgotWaive||{})[empId])}
function getEmpBonuses(empId,mk){
  const b=bonuses[mk]||[];const emp=employees.find(e=>e.id===empId);
  let total=0,list=[];
  b.filter(x=>x.empId===empId).forEach(x=>{list.push(x);total+=Number(x.amount)});
  if(emp&&emp.fixedBonus){list.push({name:emp.bonusName||'مكافأة',amount:emp.fixedBonus,visible:true});total+=emp.fixedBonus}
  return{list,total}
}
function getEmpPenalties(empId,mk){
  const p=penalties[mk]||[];let total=0,list=[];
  p.filter(x=>x.empId===empId).forEach(x=>{list.push(x);total+=Number(x.amount)});
  const emp=employees.find(e=>e.id===empId),a=emp&&autoAtt(empId,mk);
  if(a){const cfg=branchCfg(),fp=forgotPenalty(emp,a,cfg,isWaived(empId,mk));if(fp.amount>0){list.push({name:`عدم تسجيل انصراف (${fp.extra} × ${cfg.forget_penalty} يوم)`,amount:fp.amount,visible:true,auto:true});total+=fp.amount}}
  return{list,total}
}
// Withdrawals (المسحوبات): purchases on the employee's account — deducted in full from the same month.
// Not a penalty. Only the amount owed is stored (no discount details).
const WD_TYPES=['مسحوبات أدوية','مستلزمات','أخرى'];
function getEmpWithdrawals(empId,mk){const list=((withdrawals||{})[mk]||[]).filter(x=>x.empId===empId);return{list,total:Math.round(list.reduce((t,x)=>t+(+x.amount||0),0)*100)/100}}
function getAttData(empId,mk){
  const a=autoAtt(empId,mk);
  if(a)return{total:a.days,onTime:a.days-a.late,late:a.late,lateHours:Math.floor(a.lateMin/60),lateMinutes:a.lateMin%60,auto:true,forgot:a.forgot+a.fixed,open:a.open};

}
// Targets: the quarter target is automatic = (monthly sales of the chosen "target tier") × 3.
// By default the target tier is the one just below the top tier (e.g. 900,000 @1.5% → 2,700,000).
// The owner can pick another tier, or type a manual quarter / month target to override.
function tiersOfQ(q){return getTiers(`2000-${{Q1:0,Q2:3,Q3:6,Q4:9}[q]}`)}
function targetTierOf(q){const t=tiersOfQ(q),want=(quarterlyTargets[q]||{}).targetRate;if(!t.length)return null;return t.find(x=>x.rate===+want)||t[Math.max(0,t.length-2)]}
function autoQuarterTarget(q){const t=targetTierOf(q);return t?t.min*3:0}
function quarterTarget(q){const m=(quarterlyTargets[q]||{}).target;return m>0?+m:autoQuarterTarget(q)}
function isAutoQuarterTarget(q){return!((quarterlyTargets[q]||{}).target>0)}
function getMonthTarget(month=state.month){const q=monthToQuarter(month),o=((quarterlyTargets[q]||{}).months||{})[month];return o!==undefined&&o!==null&&o!==''?+o:quarterTarget(q)/3}
function quarterSalesSoFar(){const q=monthToQuarter(state.month),start={Q1:0,Q2:3,Q3:6,Q4:9}[q];let s=0;for(let m=start;m<start+3;m++)s+=(monthlyData[`${state.year}-${m}`]||{}).sales||0;return s}
function currentUserCanUpload(){if(state.user.role==='owner')return true;const empId=state.user.empId;if(!empId)return false;const emp=empRecord(empId);return emp?!!emp.canUploadPhoto:false}
function getTotalUnread(){if(state.user&&state.user.empId)return empMessages(state.user.empId).filter(m=>!m.read).length;return 0}

function getKPI(empId,mk){
  const w=kpiWeights,md=getMonthData(mk);
  const empHours=md.hours[empId]||0,totalHours=Object.values(md.hours||{}).reduce((s,h)=>s+h,0)||1;
  const hoursScore=Math.min(100,(empHours/totalHours)*employees.length*100);
  const att=getAttData(empId,mk);
  const attScore=att.total>0?(att.onTime/att.total*100):75;
  const punctScore=att.total>0?((1-(att.late/att.total))*100):80;
  const totalLateH=att.lateHours+(att.lateMinutes/60);
  const latenessScore=totalLateH>40?0:totalLateH>30?20:totalLateH>15?70:totalLateH>0?90:100;
  const empSales=(md.empSales||{})[empId]||0,totalES=Object.values(md.empSales||{}).reduce((s,v)=>s+v,0)||1;
  const salesScore=empSales>0?Math.min(100,(empSales/totalES)*employees.length*80):50;
  const mis=(missions[mk]||[]).filter(m=>m.empId===empId&&m.score!==undefined);
  const missionScore=mis.length>0?(mis.reduce((s,m)=>s+m.score,0)/mis.length):70;
  const raw=hoursScore*(w.hours/100)+attScore*(w.attendance/100)+punctScore*(w.punctuality/100)+latenessScore*(w.lateness/100)+salesScore*(w.sales/100)+missionScore*(w.missions/100)+(CRM.kpiScore(empId,mk)??75)*(w.satisfaction/100)+80*(w.teamwork/100);
  return Math.min(100,Math.max(0,Math.round(raw)));
}

function curBranch(){return branches.find(x=>x.id===state.branch)||{id:state.branch,name:branchName(state.branch)}}
function storeGet(k){return{employees:employeesAll,kpi_weights:kpiWeights,monthly_data:monthlyData,attendance,missions,messages,bonuses,penalties,quarterly_targets:quarterlyTargets,shift_schedule:shiftSchedule,commission_tiers:commissionTiers,withdrawals}[k]}
function storeSet(k,v){switch(k){case'employees':employeesAll=v;refreshEmpView();break;case'kpi_weights':kpiWeights=v;break;case'monthly_data':monthlyData=v;break;case'attendance':attendance=v;break;case'missions':missions=v;break;case'messages':messages=v;break;case'bonuses':bonuses=v;break;case'penalties':penalties=v;break;case'quarterly_targets':quarterlyTargets=v;break;case'shift_schedule':shiftSchedule=v;break;case'commission_tiers':commissionTiers=v;break;case'withdrawals':withdrawals=v;break}}
function freshBranchData(){
  return{employees:[],kpi_weights:clone(KPI_W_DEF),monthly_data:{},attendance:{},missions:{},messages:[],bonuses:{},penalties:{},
    quarterly_targets:{Q1:{target:null,months:{}},Q2:{target:null,months:{}},Q3:{target:null,months:{}},Q4:{target:null,months:{}}},
    shift_schedule:{},commission_tiers:{...clone(COMM_TIERS_DEF),_v:2},withdrawals:{}};
}
function stashBranch(){const d=branchData[state.branch];if(d)STORE_KEYS.forEach(k=>{d[k]=storeGet(k)})}
function useBranch(b){
  stashBranch();
  state.branch=b;
  const d=branchData[b]||(branchData[b]=freshBranchData());
  STORE_KEYS.forEach(k=>storeSet(k,d[k]));normalize();STORE_KEYS.forEach(k=>{d[k]=storeGet(k)});
}
// Run fn with another branch's data active, then switch back (used for cross-branch summaries).
function withBranch(b,fn){const cur=state.branch;if(b===cur)return fn();useBranch(b);try{return fn()}finally{useBranch(cur)}}
function resetData(){
  branches=[];branchData={};state.branch=null;state.checkin=null;cache={};attDays={};_attMemo={};
  const d=freshBranchData();STORE_KEYS.forEach(k=>storeSet(k,d[k]));
  users=[];myView=null;leaderboardView=null;myOtherViews={};_synced={};_viewSynced={};_branchesSynced=null;
}
function normalize(){
  if(!Array.isArray(employeesAll))employeesAll=[];

  const obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};
  monthlyData=obj(monthlyData);attendance=obj(attendance);missions=obj(missions);bonuses=obj(bonuses);penalties=obj(penalties);quarterlyTargets=obj(quarterlyTargets);shiftSchedule=obj(shiftSchedule);commissionTiers=obj(commissionTiers);withdrawals=obj(withdrawals);
}
function profileToUser(p){return{id:p.id,username:p.username,name:p.name,role:p.role,empId:p.emp_id||null,branch:p.branch||null,pages:Array.isArray(p.pages)?p.pages:[]}}
function allEmployees(){return Object.entries(branchData).flatMap(([b,d])=>(b===state.branch?employeesAll:d.employees||[]).map(e=>({...e,branch:b})))}
const mkOrd=mk=>{const[y,m]=String(mk).split('-').map(Number);return y*12+m};
function refreshEmpView(){const cur=mkOrd(monthKey());employees=(employeesAll||[]).filter(e=>!e.leftMk||mkOrd(e.leftMk)>=cur)}

async function loadStaffData(){
  const{data,error}=await sb.from('app_store').select('id,data');
  if(error)throw error;
  const br=data.find(r=>r.id==='branches');
  if(!br)throw new Error('needs_update'); // leftovers without a branch prefix (written by an old cached copy of the app) are ignored
  branches=Array.isArray(br.data)?br.data:[];_branchesSynced=stableStr(branches);
  const mine=isOwner()?branches.map(b=>b.id):[state.user.branch].filter(Boolean);
  if(!mine.length)throw new Error('no_branch');
  branchData={};state.branch=null;
  mine.forEach(b=>{branchData[b]=freshBranchData()});
  data.forEach(r=>{
    const i=r.id.indexOf('/');if(i<0)return;
    const b=r.id.slice(0,i),k=r.id.slice(i+1);
    if(!branchData[b]||!STORE_KEYS.includes(k)||r.data==null)return;
    branchData[b][k]=r.data;_synced[r.id]=stableStr(r.data);
  });
  mine.forEach(b=>{
    useBranch(b);
    // v2 upgrade (once per branch): Q4 uses the new formula; quarter targets become automatic.
    if(!(commissionTiers._v>=2)){
      commissionTiers.Q4=clone(COMM_TIERS_DEF.Q4);commissionTiers._v=2;
      ['Q1','Q2','Q3','Q4'].forEach(q=>{if(!quarterlyTargets[q]||typeof quarterlyTargets[q]!=='object')quarterlyTargets[q]={months:{}};quarterlyTargets[q].target=null});
    }
  });
  const pref=ls('branch');
  useBranch(mine.includes(pref)?pref:mine[0]);
}
async function loadUsers(){
  if(!isOwner()){users=[];return}
  const{data,error}=await sb.from('profiles').select('id,username,name,role,emp_id,pages,branch').order('created_at');
  if(error)throw error;
  users=data.map(profileToUser);
}
async function loadViewCache(){

}
async function loadEmpData(){
  const{data,error}=await sb.from('emp_view').select('emp_id,data').in('emp_id',[state.user.empId||'-','_lb/'+state.user.branch]);
  if(error)throw error;
  myView=null;leaderboardView=null;
  data.forEach(r=>{if(r.emp_id.startsWith('_lb/'))leaderboardView=r.data;else myView=r.data});
  // other branches this employee also works in (rows '<code>@<branch>')
  const others={};
  if(state.user.empId){const r=await sb.from('emp_view').select('emp_id,data').like('emp_id',state.user.empId+'@%');
    if(!r.error)(r.data||[]).forEach(x=>{const b=x.emp_id.slice(x.emp_id.indexOf('@')+1);if(x.data&&x.data.emp&&b!==state.user.branch)others[b]=x.data})}
  myOtherViews=others;
}
// Render something with another branch's snapshot as if it were the employee's own (two-branch employees).
function withEmpView(v,fn){const mv=myView,br=state.branch,io=_inOtherView;myView=v;state.branch=v.emp.branch;_inOtherView=true;try{return fn()}finally{myView=mv;state.branch=br;_inOtherView=io}}

let _saveChain=Promise.resolve();
function saveAll(){_saveChain=_saveChain.then(doSave);return _saveChain}
async function doSave(){
  if(!isStaff())return;
  stashBranch();
  const rows=[];
  Object.keys(branchData).forEach(b=>STORE_KEYS.forEach(k=>{const id=`${b}/${k}`,s=stableStr(branchData[b][k]);if(s!==_synced[id])rows.push({id,s})}));
  if(isOwner()){const s=stableStr(branches);if(s!==_branchesSynced)rows.push({id:'branches',s})}
  try{
    if(rows.length){
      const now=new Date().toISOString();
      const{error}=await sb.from('app_store').upsert(rows.map(r=>({id:r.id,data:JSON.parse(r.s),updated_at:now})));
      if(error)throw error;
      rows.forEach(r=>{if(r.id==='branches')_branchesSynced=r.s;else _synced[r.id]=r.s});
    }
    await publishEmpViews();
    setSync('live');
  }catch(e){console.error('Save failed',e);setSync('error');showToast('تعذّر الحفظ في السحابة — تحقق من الإنترنت وأعد المحاولة','error')}
}
function setSync(s){if(state.syncStatus===s)return;state.syncStatus=s;const el=document.getElementById('sync-status');if(el)el.outerHTML=syncStatusHTML()}

// Each employee gets a personal snapshot with ONLY their own numbers,
// plus a per-branch leaderboard (names + KPI). This is what employees can read.
function allMonthKeys(){
  const ks=new Set();
  [monthlyData,attendance,missions,bonuses,penalties].forEach(o=>Object.keys(o||{}).forEach(k=>ks.add(k)));
  [new Date().getFullYear(),state.year].forEach(y=>{for(let m=0;m<12;m++)ks.add(`${y}-${m}`)});
  return[...ks];
}
function empMonthStats(emp,mk){
  const md=getMonthData(mk),commData=calcCommission(md.sales||0,mk),hrs=(md.hours||{})[emp.id]||0,sal=calcSalary(emp,hrs);
  const comm=emp.commPct>0?commData.pool*(emp.commPct/100):0,{total:bt}=getEmpBonuses(emp.id,mk),{total:pt}=getEmpPenalties(emp.id,mk);
  const a=autoAtt(emp.id,mk),fp=forgotPenalty(emp,a,branchCfg(),isWaived(emp.id,mk)),w=getEmpWithdrawals(emp.id,mk),wd=w.total;
  return{hrs,sal,comm,bt,pt,wd,wdList:w.list.map(x=>({date:x.date,type:x.type,amount:+x.amount,note:x.note||''})),ptManual:pt-fp.amount,ptDays:dayPen(emp.id,mk).days,ptDayAmt:dayPen(emp.id,mk).amt,net:sal+comm+bt-pt-wd,kpi:getKPI(emp.id,mk),att:getAttData(emp.id,mk),empSales:(md.empSales||{})[emp.id]||0,salesPct:salesShare(md,emp.id),commOff:!!commData.off,lateExcused:excusesOf(emp.id,mk).map(x=>({date:x.date,note:x.note||''})),lateFree:lateFreeOf(mk).map(x=>({date:x.date,note:x.note||''})),badges:empBadges(emp.id,mk).map(x=>{const b=badgeOf(x);return{k:b.k,icon:b.icon,name:b.name,desc:b.desc,note:x.note||''}}),commRate:commData.rate,auto:!!a,forgotPen:fp,forgotWaived:fp.waived};
}
// employee's share of the branch's total sales for the month (0 when the employee has no sales entered)
function salesShare(md,empId){const es=(md.empSales||{})[empId]||0,tot=(md.sales||0)||Object.values(md.empSales||{}).reduce((t,v)=>t+(+v||0),0);return es>0&&tot>0?Math.round(es/tot*1000)/10:0}
function buildEmpView(empId){
  const e=employees.find(x=>x.id===empId);
  const months={};allMonthKeys().forEach(mk=>{months[mk]=empMonthStats(e,mk)});
  const ms={};Object.entries(missions||{}).forEach(([mk,arr])=>{const mine=(arr||[]).filter(m=>m.empId===empId);if(mine.length)ms[mk]=mine});
  return{emp:{id:e.id,name:e.name,role:e.role,shift:e.shift,commPct:e.commPct,canUploadPhoto:!!e.canUploadPhoto,noGeo:!!e.noGeo,fixedBonus:e.fixedBonus||0,hourRate:e.hourRate,scheduledTime:e.scheduledTime,branch:state.branch,branchName:branchName(state.branch),cfg:branchCfg()},months,missions:ms,messages:messages.filter(m=>m.to===empId)};
}
function lbBadges(empId,mk){return empBadges(empId,mk).map(x=>{const b=badgeOf(x);return{icon:b.icon,name:b.name}})}
function buildLeaderboard(){const out={};allMonthKeys().forEach(mk=>{out[mk]=employees.map(e=>({id:e.id,name:e.name,role:e.role,kpi:getKPI(e.id,mk),badges:lbBadges(e.id,mk)}))});return out}
async function publishEmpViews(){
  const rows=[],cur=state.branch;
  const add=(id,b,obj)=>{const s=stableStr(obj);if(s!==_viewSynced[id])rows.push({id,b,s})};
  try{
    for(const b of Object.keys(branchData)){
      useBranch(b);
      employees.filter(e=>!e.movedTo).forEach(e=>add(e.home?`${e.id}@${b}`:e.id,b,buildEmpView(e.id))); // a second-branch record gets its own row
      add('_lb/'+b,b,buildLeaderboard());
    }
  }finally{useBranch(cur)}
  if(!rows.length)return;
  const now=new Date().toISOString();
  const{error}=await sb.from('emp_view').upsert(rows.map(r=>({emp_id:r.id,branch:r.b,data:JSON.parse(r.s),updated_at:now})));
  if(error)throw error;
  rows.forEach(r=>{_viewSynced[r.id]=r.s});
}

// Same questions, answered from full data (staff) or from the personal snapshot (employee).
function empRecord(empId){if(isStaff())return employees.find(e=>e.id===empId);return myView?.emp?.id===empId?myView.emp:null}
function empStats(empId,mk){
  if(isStaff()){const e=employees.find(x=>x.id===empId);return e?empMonthStats(e,mk):null}
  const fb=myView?.emp?.fixedBonus||0;
  const s=myView?.months?.[mk]||{hrs:0,sal:0,comm:0,bt:fb,pt:0,wd:0,wdList:[],ptManual:0,net:fb,kpi:0,att:{onTime:0,late:0,total:0,lateHours:0,lateMinutes:0},empSales:0,commRate:0};
  // Live: hours/attendance straight from this employee's own check-ins
  const e=myView?.emp,a=e&&autoAtt(e.id,mk,state.branch,e);if(!a)return s;
  const fp=forgotPenalty(e,a,branchCfg(),!!s.forgotWaived),hrs=a.hrs,sal=((+e.hourRate||0)/26)*hrs,pt=(s.ptManual??s.pt??0)+fp.amount;
  return{...s,hrs,sal,pt,net:sal+(s.comm||0)+(s.bt||0)-pt-(s.wd||0),auto:true,forgotPen:fp,
    att:{total:a.days,onTime:a.days-a.late,late:a.late,lateHours:Math.floor(a.lateMin/60),lateMinutes:a.lateMin%60,auto:true,forgot:a.forgot+a.fixed,open:a.open}};
}
function empMissions(empId,mk){if(isStaff())return(missions[mk]||[]).filter(m=>m.empId===empId);const own=(myView?.missions||{})[mk]||[];return _inOtherView?own:own.concat(...Object.values(myOtherViews||{}).map(v=>(v.missions||{})[mk]||[]))}
// ── Tasks have a start date and a deadline (weeks start on Saturday). Old tasks with only «الأسبوع 1–4»
// get the dates of that week of their pay month.
const addDays=(s,n)=>{const d=new Date(String(s).slice(0,10)+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
function weekStartSat(s){const d=new Date(String(s).slice(0,10)+'T00:00:00Z');return addDays(s,-((d.getUTCDay()+1)%7))}
function missionDates(m,mk=monthKey()){
  if(m.start&&m.due)return{start:m.start,due:m.due};
  const[y,mo]=String(mk).split('-').map(Number),p=payPeriod(y,mo),w=Math.min(4,Math.max(1,+m.week||1)),start=addDays(p.from,(w-1)*7);
  return{start,due:w>=4?p.to:addDays(start,6)};
}
// default deadline: this week's Friday, or next week's when fewer than 2 days are left
function defaultTaskDue(){const t=todayCairo();let d=addDays(weekStartSat(t),6);if(d<addDays(t,2))d=addDays(d,7);return d}
function missionState(m,mk){
  if(m.score!==undefined)return'scored';if(m.completed)return'review';
  const{start,due}=missionDates(m,mk),t=todayCairo();return due<t?'late':start>t?'upcoming':'open';
}
const fmtDM=s=>{const[,mm,dd]=String(s).split('-');return`${+dd}/${+mm}`};
function empMessages(empId){if(isStaff())return messages.filter(m=>m.to===empId);const own=myView?.messages||[];return _inOtherView?own:own.concat(...Object.values(myOtherViews||{}).map(v=>v.messages||[]))}
function rankedFor(mk){
  const list=isStaff()?employees.map(e=>({id:e.id,name:e.name,role:e.role,kpi:getKPI(e.id,mk)})):[...((leaderboardView||{})[mk]||[])];
  return list.sort((a,b)=>b.kpi-a.kpi);
}

const EDIT_PAGES=['monthly','attendance','kpi','settings','shifts','employees','myleaves'];
function subscribeRealtime(){
  if(_realtimeSub){sb.removeChannel(_realtimeSub);_realtimeSub=null}
  if(isKiosk())return;
  const table=isStaff()?'app_store':'emp_view';
  _realtimeSub=sb.channel('ek_'+table)
    .on('postgres_changes',{event:'*',schema:'public',table},p=>onRemoteChange(table,p))
    .on('postgres_changes',{event:'*',schema:'public',table:'leave_requests'},()=>{delete cache.leaves;loadLeaves().then(()=>{if(!state.modal&&!EDIT_PAGES.includes(state.page))render()})})
    .on('postgres_changes',{event:'*',schema:'public',table:'checkins'},onAttChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'fix_requests'},onAttChange)
    .subscribe();
}
let _attTimer=null;
function onAttChange(){
  clearTimeout(_attTimer);
  _attTimer=setTimeout(async()=>{
    delete cache.checkins;delete cache.mycheckins;delete cache.fixes;
    await ensureAtt(true);
    if(isStaff()){loadFixes().catch(()=>{});saveAll()}
    if(!state.modal&&!(isStaff()&&EDIT_PAGES.includes(state.page))&&state.page!=='kiosk')render();
  },1200);
}
async function onRemoteChange(table,p){
  try{
    if(table==='app_store'){
      const id=p.new?.id||p.old?.id;if(!id)return;
      let data=p.new?.data;
      if(data===undefined){const r=await sb.from('app_store').select('data').eq('id',id).maybeSingle();data=r.data?.data}
      if(data==null)return;
      const s=stableStr(data);
      if(id==='branches'){if(s===_branchesSynced)return;branches=data;_branchesSynced=s}
      else{
        const i=id.indexOf('/');if(i<0)return;
        const b=id.slice(0,i),k=id.slice(i+1);
        if(!branchData[b]||!STORE_KEYS.includes(k)||s===_synced[id])return; // not ours, or our own save coming back
        _synced[id]=s;
        if(b===state.branch){storeSet(k,data);normalize();branchData[b][k]=storeGet(k)}else branchData[b][k]=data;
      }
    }else{
      await loadEmpData();
    }
    // Don't wipe what someone is typing: data is updated now, screen refreshes on next navigation.
    if(state.modal||(isStaff()&&EDIT_PAGES.includes(state.page))||state.page==='kiosk')return;
    render();
  }catch(e){console.warn('Realtime update error',e)}
}

async function afterLogin(session){
  const ver=await sb.rpc('app_version');
  if(ver.error||!(ver.data>=3))throw new Error('needs_update');
  const{data:p,error}=await sb.from('profiles').select('id,username,name,role,emp_id,pages,branch').eq('id',session.user.id).maybeSingle();
  if(error)throw error;
  if(!p){await sb.auth.signOut();throw new Error('no_profile')}
  state.user=profileToUser(p);
  resetData();
  if(isStaff()){
    await loadStaffData();await loadUsers();await loadViewCache();
    await ensureAtt();
    saveAll(); // seeds first-time data and refreshes employee snapshots
    loadFixes().catch(()=>{});
    loadLeaves();
  }else if(isKiosk()){
    state.branch=state.user.branch;
  }else{
    state.branch=state.user.branch;
    await loadEmpData();
    await ensureAtt();
    loadLeaves();
  }
  state.dismissedNotifs=ls('dismissed_notifs')||[];
  state.page=isKiosk()?'kiosk':(state.user.pages[0]||'myperformance');
  state.loggedIn=true;
  subscribeRealtime();
  CRM.onLogin(); // CRM
  FIN.onLogin(); // المالية
  NOTIF.onLogin(); // الإشعارات
}
async function doLogout(){
  if(_realtimeSub){sb.removeChannel(_realtimeSub);_realtimeSub=null}
  stopKiosk();
  try{await _saveChain}catch{}
  await sb.auth.signOut();
  logoutLocal();
}
function logoutLocal(){CRM.reset();FIN.reset();NOTIF.reset();stopKiosk();document.querySelectorAll('.toast').forEach(t=>t.remove());state.loggedIn=false;state.user=null;state.myPerfEmpId=null;state.modal=null;resetData();render()}

function showToast(msg,type='success'){
  const el=document.createElement('div');
  el.className=`toast toast-${type}`;
  el.innerHTML=`<span>${type==='success'?'✅':type==='error'?'❌':'ℹ️'}</span><span>${msg}</span>`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2800);
}

function buildOwnerNotifs(){
  const mk=monthKey(),notifs=[];
  const pending=(missions[mk]||[]).filter(m=>m.completed&&m.score===undefined);
  if(pending.length>0){const id='owner_pending_'+mk;if(!state.dismissedNotifs.includes(id))notifs.push({id,type:'owner',icon:'🎯',msg:`${pending.length} مهمة مكتملة تنتظر التقييم`})}
  const md=getMonthData();if(commOn()&&(md.sales||0)>0&&(md.sales||0)<commThreshold()){const id='owner_sales_'+mk;if(!state.dismissedNotifs.includes(id))notifs.push({id,type:'owner',icon:'⚠️',msg:`المبيعات أقل من حد العمولة — تحتاج ${fmtNum(commThreshold()-(md.sales||0))} ج.م إضافية`})}
  return notifs;
}
function buildSeniorNotifs(){
  const mk=monthKey(),notifs=[];
  const myEmpId=state.user.empId;
  const assignedEmps=myEmpId?(SENIOR_ASSIGNS[myEmpId]||employees.map(e=>e.id)):[];
  const pending=(missions[mk]||[]).filter(m=>assignedEmps.includes(m.empId)&&m.completed&&m.score===undefined);
  if(pending.length>0){const id='senior_pending_'+mk+'_'+myEmpId;if(!state.dismissedNotifs.includes(id))notifs.push({id,type:'owner',icon:'🎯',msg:`${pending.length} مهمة مكتملة تنتظر التقييم`})}
  return notifs;
}
function buildEmpNotifs(empId){
  const mk=monthKey(),notifs=[];
  const ranked=rankedFor(mk).map(r=>({e:r,kpi:r.kpi}));
  const top=ranked[0],myKpi=(ranked.find(r=>r.e.id===empId)||{kpi:empStats(empId,mk)?.kpi||0}).kpi;
  if(top){const id=`top_${mk}_${top.e.id}`;if(!state.dismissedNotifs.includes(id)){if(top.e.id===empId)notifs.push({id,type:'gold',icon:'🏆',msg:`أنت المتصدر هذا الشهر بدرجة KPI ${top.kpi}%`});else notifs.push({id,type:'success',icon:'🏆',msg:`المتصدر هذا الشهر: ${top.e.name} بـ ${top.kpi}%`})}}
  if(myKpi<60){const id=`improve_${mk}_${empId}`;if(!state.dismissedNotifs.includes(id))notifs.push({id,type:'warn',icon:'📉',msg:`درجة KPI الخاصة بك ${myKpi}% — يحتاج تحسين`})}
  const newlyRated=empMissions(empId,mk).filter(m=>m.score!==undefined&&!m.seenByEmployee);
  if(newlyRated.length>0){const id=`rated_${mk}_${empId}`;if(!state.dismissedNotifs.includes(id))notifs.push({id,type:'gold',icon:'⭐',msg:`لديك ${newlyRated.length} مهمة تم تقييمها`})}
  return notifs;
}

  const comm=[];if(has('messages'))comm.push({id:'messages',icon:'💬',label:'الرسائل'});if(has('audit'))comm.push({id:'audit',icon:'🕵️',label:'سجل التغييرات'});if(has('settings'))comm.push({id:'settings',icon:'⚙️',label:'الإعدادات'});if(comm.length)groups.push({group:'أخرى',items:comm});
  groups[state.user.role==='senior'?'unshift':'push']({group:'حسابي',items:[...(state.user.empId?[{id:'mycheckin',icon:'📍',label:'الحضور وساعاتي'}]:[]),{id:'myperformance',icon:'🪪',label:'أدائي الشهري'},...(state.user.empId?[{id:'myleaves',icon:'🌴',label:'إجازاتي'}]:[]),{id:'mypassword',icon:'🔑',label:'كلمة المرور'}]});

function loginErrMsg(e){
  if(e.message==='no_profile')return'هذا الحساب غير مفعّل — تواصل مع المالك';
  if(e.message==='needs_update')return'قاعدة البيانات تحتاج تحديث: شغّل ملفات التحديث في Supabase ← SQL Editor (supabase-update-2.sql ثم supabase-update-3.sql) ثم أعد الدخول';
  if(e.message==='no_branch')return'هذا الحساب غير مرتبط بفرع — تواصل مع المالك';
  return'تعذّر تحميل البيانات: '+errMsg(e);
}
function bindLogin(){
  const doLogin=async()=>{
    const u=document.getElementById('login-user').value.trim();
    const p=document.getElementById('login-pass').value;
    const errEl=document.getElementById('login-err'),btn=document.getElementById('login-btn');
    if(!u||!p){errEl.textContent='أدخل اسم المستخدم وكلمة المرور';return}
    errEl.textContent='';btn.disabled=true;btn.textContent='⏳ جاري الدخول…';
    const{data,error}=await sb.auth.signInWithPassword({email:loginEmail(u),password:p});
    if(error){
      btn.disabled=false;btn.textContent='دخول';
      errEl.textContent=/invalid/i.test(error.message)?'اسم المستخدم أو كلمة المرور غير صحيحة':'تعذّر الاتصال: '+error.message;
      return;
    }
    state.loading=true;state.loginError='';render();
    try{await afterLogin(data.session)}
    catch(e){
      console.error(e);
      state.loginError=loginErrMsg(e);
      await sb.auth.signOut().catch(()=>{});
    }
    state.loading=false;render();
    handlePendingCheckin();
  };
  document.getElementById('login-btn').onclick=doLogin;
  document.getElementById('login-pass').onkeydown=e=>{if(e.key==='Enter')doLogin()};
  document.getElementById('login-user').onkeydown=e=>{if(e.key==='Enter')document.getElementById('login-pass').focus()};
  document.getElementById('toggle-pass').onclick=()=>{const inp=document.getElementById('login-pass');inp.type=inp.type==='password'?'text':'password'};
}

// Payroll rows of the ACTIVE branch for a pay month — used by the payroll page and by المالية (finance.js),
// so both always show the same net pay. Employees who left before the month are excluded.
function payrollRows(mk=monthKey()){
  const md=getMonthData(mk),commData=calcCommission(md.sales||0,mk);
  const list=mk===monthKey()?employees:(employeesAll||[]).filter(e=>!e.leftMk||mkOrd(e.leftMk)>=mkOrd(mk));
  return{md,commData,rows:list.map(e=>{const hrs=md.hours[e.id]||0,sal=calcSalary(e,hrs),comm=e.commPct>0?commData.pool*(e.commPct/100):0,{total:bt}=getEmpBonuses(e.id,mk),{total:pt}=getEmpPenalties(e.id,mk),{total:wd}=getEmpWithdrawals(e.id,mk),net=sal+comm+bt-pt-wd,dp=dayPen(e.id,mk);return{e,hrs,sal,comm,bt,pt,wd,net,ptDays:dp.days,ptDayAmt:dp.amt}})};
}

function renderMissions(){
  const mk=monthKey(),allMissions=missions[mk]||[];
  return`<div class="section-header"><h3>المهام — ${MONTHS_AR[state.month]} ${state.year}</h3><button class="btn btn-primary" id="add-mission-btn">+ إضافة مهمة</button></div>
  ${[['late','⏳ متأخرة — فات موعدها ولم تُنجز'],['review','⌛ منتهية — تنتظر التقييم'],['open','🔄 جارية'],['upcoming','🗓️ لم تبدأ بعد'],['scored','✅ تم تقييمها']].map(([k,t])=>{const wm=allMissions.filter(m=>missionState(m,mk)===k).sort((a,b)=>missionDates(a,mk).due<missionDates(b,mk).due?-1:1);if(!wm.length&&k!=='open')return'';return`<div class="card" style="margin-bottom:12px"><div class="section-header"><h3>${t}</h3><span class="badge badge-gray">${wm.length} مهمة</span></div>${wm.length===0?'<p style="color:var(--text3);font-size:13px">لا توجد مهام جارية</p>':''}${wm.map(m=>missionCard(m,false,true)).join('')}</div>`}).join('')}`;

  return`<div class="grid-2">
    <div class="card"><div class="section-header"><h3>🎁 المكافآت <span class="badge badge-green" style="margin-right:6px">${sgn(totalB,'+')} ج.م</span></h3><button class="btn btn-success btn-sm" id="add-bonus-btn">+ إضافة</button></div>
      ${b.length===0?'<p style="color:var(--text3);font-size:13px">لا توجد مكافآت هذا الشهر</p>':''}
      ${b.map((x,i)=>`<div class="card-sm" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:700">${employees.find(e=>e.id===x.empId)?.name||x.empId}</div><div style="font-size:11px;color:var(--text2)">${bpLabel(x)} — ${x.visible?'مرئية':'سرية'}</div></div><div style="display:flex;gap:8px;align-items:center"><span style="color:var(--success);font-weight:800">\u200E+${fmtNum(x.amount)}</span><button class="btn btn-danger btn-xs" data-del-bonus="${i}">×</button></div></div>`).join('')}
    </div>
    <div class="card"><div class="section-header"><h3>⚠️ الجزاءات <span class="badge badge-red" style="margin-right:6px">${isOwner()?sgn(totalP,'-')+' ج.م':penShow(totalP,p.reduce((t,x)=>t+(+x.days||0),0),p.reduce((t,x)=>t+(x.days?+x.amount:0),0))}</span></h3><button class="btn btn-danger btn-sm" id="add-penalty-btn">+ إضافة</button></div>
      ${p.length===0?'<p style="color:var(--text3);font-size:13px">لا توجد جزاءات هذا الشهر</p>':''}
      ${p.map((x,i)=>`<div class="card-sm" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:700">${employees.find(e=>e.id===x.empId)?.name||x.empId}</div><div style="font-size:11px;color:var(--text2)">${bpLabel(x)} — ${x.visible?'مرئية':'سرية'}</div></div><div style="display:flex;gap:8px;align-items:center"><span style="color:var(--danger);font-weight:800">${penItemAmount(x,v=>fmtNum(v))}</span><button class="btn btn-danger btn-xs" data-del-penalty="${i}">×</button></div></div>`).join('')}
    </div>

    <p style="color:var(--text2);font-size:12px;margin-bottom:10px">تقدير معنوي يظهر للموظف في «أدائي الشهري» وبجوار اسمه في «المتصدرون» — لا يؤثر على الراتب.</p>
    ${bd.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px">${bd.map(x=>{const b=badgeOf(x);return`<div class="card-sm" style="display:flex;gap:10px;align-items:center"><div style="font-size:28px">${b.icon}</div><div style="flex:1"><div style="font-weight:700">${esc(employees.find(e=>e.id===x.empId)?.name||x.empId)}</div><div style="font-size:12px;color:var(--text2)">${esc(b.name)}${x.note?' — '+esc(x.note):''}</div>${x.by?`<div style="font-size:10px;color:var(--text3)">منحها: ${esc(x.by)}</div>`:''}</div><button class="btn btn-danger btn-xs" data-del-badge="${esc(x.id)}">×</button></div>`}).join('')}</div>`:'<p style="color:var(--text3);font-size:13px">لم يُمنح أي وسام هذا الشهر</p>'}</div>`})()}`;

    <div class="grid-3" style="margin-bottom:12px">${[{k:'hours',l:'حصة الساعات'},{k:'attendance',l:'الحضور'},{k:'punctuality',l:'الانضباط'},{k:'lateness',l:'إجمالي التأخير'},{k:'sales',l:'المبيعات الشخصية'},{k:'missions',l:'المهام'},{k:'satisfaction',l:'متابعة العملاء (CRM)'},{k:'teamwork',l:'العمل الجماعي'}].map(ww=>`<div class="card-sm" style="text-align:center"><div style="font-size:11px;color:var(--text2);margin-bottom:4px">${ww.l}</div><div style="font-size:22px;font-weight:800;color:var(--accent3)" id="kw-display-${ww.k}">${w[ww.k]||0}%</div><input type="range" min="0" max="40" value="${w[ww.k]||0}" class="kpi-weight-inp" data-key="${ww.k}" style="margin-top:6px;width:100%;accent-color:var(--accent)"></div>`).join('')}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><span style="font-size:13px;color:var(--text2)">المجموع: <strong id="kpi-weight-total" style="color:${totalW===100?'var(--success)':'var(--danger)'}">${totalW}%</strong> ${totalW!==100?'⚠️ يجب أن يساوي 100%':''}</span></div></div>

function renderLeaderboard(){
  const mk=monthKey(); // salaries are not shown on the leaderboard
  const ranked=isStaff()
    ?[...employees].map(e=>({e,kpiScore:getKPI(e.id,mk),badges:lbBadges(e.id,mk)})).sort((a,b)=>b.kpiScore-a.kpiScore)
    :rankedFor(mk).map(r=>({e:r,kpiScore:r.kpi,badges:r.badges||[]}));
  if(!ranked.length)return`<div class="card" style="text-align:center;color:var(--text3);padding:40px">لا توجد بيانات لهذا الشهر بعد</div>`;
  const top3=ranked.slice(0,3);
  const rest=ranked.slice(3);
  return`<div class="section-header"><h3>🏆 المتصدرون — ${MONTHS_AR[state.month]} ${state.year}</h3><span class="badge badge-gray">${ranked.length} موظف</span></div>
  <div class="grid-3" style="margin-bottom:20px">${top3.map((r,i)=>`<div class="podium-card rank-${i+1}"><div style="font-size:${i===0?'36px':'28px'};margin-bottom:6px">${['🥇','🥈','🥉'][i]}</div><div style="font-weight:800;font-size:15px">${r.e.name}</div>${r.badges.length?`<div style="margin-top:4px;display:flex;gap:4px;justify-content:center;flex-wrap:wrap">${badgeChips(r.badges,20)}</div>`:''}<div style="font-size:11px;color:var(--text2);margin-top:2px">${r.e.role}</div><div style="font-size:36px;font-weight:800;color:${kpiColor(r.kpiScore)};margin:12px 0">${r.kpiScore}</div><div class="kpi-bar" style="margin-bottom:8px"><div class="kpi-fill" style="width:${r.kpiScore}%;background:${kpiColor(r.kpiScore)}"></div></div><span class="badge" style="background:${kpiColor(r.kpiScore)}22;color:${kpiColor(r.kpiScore)}">${kpiLabel(r.kpiScore)}</span>${i===0?`<div style="position:absolute;top:-8px;right:-8px;font-size:22px">👑</div>`:''}</div>`).join('')}
  </div>
  <div class="card">${rest.map((r,i)=>`<div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)"><div style="width:28px;text-align:center;font-weight:800;color:var(--text3);font-size:16px">${i+4}</div><div style="flex:1"><div style="font-weight:700">${r.e.name} ${badgeChips(r.badges,16)}</div><div style="font-size:11px;color:var(--text2)">${r.e.role}</div><div class="kpi-bar" style="margin-top:5px"><div class="kpi-fill" style="width:${r.kpiScore}%;background:${kpiColor(r.kpiScore)}"></div></div></div><div style="text-align:center;min-width:52px"><div style="font-weight:800;color:${kpiColor(r.kpiScore)};font-size:18px">${r.kpiScore}</div></div></div>`).join('')}</div>`;
}

function renderInsights(){
  const md=getMonthData(),mk=monthKey(),commData=calcCommission(md.sales||0);
  const totalSal=employees.reduce((s,e)=>s+calcSalary(e,md.hours[e.id]||0),0);
  const insights=[];
  if(commOn()&&(md.sales||0)<commThreshold())insights.push({t:'warn',icon:'⚠️',title:'المبيعات أقل من حد العمولة',body:`تحتاج ${fmtNum(commThreshold()-(md.sales||0))} ج.م إضافية لبدء العمولة`});
  else if(commOn())insights.push({t:'success',icon:'✅',title:'تم تحقيق حد العمولة',body:`${fmtNum(md.sales)} ج.م — ${commData.rate}% — مجمع ${fmtNum(commData.pool,2)} ج.م`});
  if(md.np&&totalSal>0){const r=totalSal/md.np*100;if(r>35)insights.push({t:'warn',icon:'💸',title:`تكلفة العمالة مرتفعة — ${r.toFixed(1)}%`,body:'تكلفة العمالة تتجاوز 35% من صافي الربح'});else insights.push({t:'success',icon:'💰',title:`تكلفة العمالة معقولة — ${r.toFixed(1)}%`,body:'نسبة صحية من صافي الربح'})}
  const target=getMonthTarget();if(target>0&&(md.sales||0)>0){const pct=((md.sales||0)/target*100);insights.push({t:pct>=100?'success':'warn',icon:pct>=100?'🎯':'📊',title:`تحقيق الهدف: ${pct.toFixed(1)}%`,body:`${fmtNum(md.sales||0)} من أصل ${fmtNum(target)} ج.م`})}
  const top=[...employees].sort((a,b)=>getKPI(b.id,mk)-getKPI(a.id,mk))[0];
  if(top)insights.push({t:'info',icon:'🏆',title:`أفضل أداء — ${top.name}`,body:`KPI: ${getKPI(top.id,mk)} — ${kpiLabel(getKPI(top.id,mk))}`});
  const low=employees.filter(e=>getKPI(e.id,mk)<60);if(low.length)insights.push({t:'warn',icon:'📉',title:`${low.length} موظف يحتاج تحسين في الأداء`,body:low.map(e=>e.name).join('، ')});
  const highLate=employees.filter(e=>{const a=getAttData(e.id,mk);return(a.lateHours+(a.lateMinutes/60))>30});if(highLate.length)insights.push({t:'warn',icon:'⏰',title:`${highLate.length} موظف تأخيرهم يتجاوز 30 ساعة`,body:highLate.map(e=>e.name).join('، ')});
  const pending=(missions[mk]||[]).filter(m=>m.completed&&m.score===undefined);if(pending.length)insights.push({t:'warn',icon:'🎯',title:`${pending.length} مهمة تنتظر التقييم`,body:'يرجى مراجعة المهام المكتملة وتقييمها'});
  return`<div style="display:flex;flex-direction:column;gap:12px">${insights.map(ins=>`<div class="card" style="border-right:4px solid ${ins.t==='success'?'var(--success)':ins.t==='warn'?'var(--warn)':'var(--accent)'}"><div style="display:flex;gap:14px;align-items:center"><div style="font-size:28px">${ins.icon}</div><div><div style="font-weight:800;font-size:14px;margin-bottom:3px">${ins.title}</div><div style="font-size:13px;color:var(--text2)">${ins.body}</div></div></div></div>`).join('')}</div>`;
}

function renderMessages(){
  const isOwner=state.user.role==='owner'||state.user.role==='senior';
  const relevant=isOwner?messages:messages.filter(m=>m.to===state.user.empId);

function loadScript(src){return _scripts[src]||(_scripts[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete _scripts[src];rej(new Error('تعذّر تحميل مكتبة — تحقق من الإنترنت'))};document.head.appendChild(s)}))}
const TZ='Africa/Cairo';
const _tzFmt=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function cairo(d){const p={};_tzFmt.formatToParts(new Date(d)).forEach(x=>{p[x.type]=x.value});const hh=(+p.hour)%24;return{y:+p.year,m:+p.month-1,d:+p.day,hh,mm:+p.minute,date:`${p.year}-${p.month}-${p.day}`,time:`${String(hh).padStart(2,'0')}:${p.minute}`}}

function fmtDay(dateStr){const[y,m,d]=dateStr.split('-').map(Number);const wd=new Date(Date.UTC(y,m-1,d)).getUTCDay();return`${['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][wd]} ${d}/${m}`}

function monthRangeISO(y,m){const p=payPeriod(y,m);return[new Date(new Date(p.from+'T00:00:00Z')-86400000).toISOString(),new Date(+new Date(p.to+'T00:00:00Z')+2*86400000).toISOString()]}

const _loading={};
// Returns cached rows, or null while loading (and re-renders when ready).
function lazy(name,key,loader){
  const c=cache[name];if(c&&c.key===key)return c.rows;
  const tag=name+'|'+key;
  if(!_loading[tag]){_loading[tag]=true;loader().catch(e=>{cache[name]={key,rows:[],error:errMsg(e)}}).finally(()=>{delete _loading[tag];if(!state.modal&&state.loggedIn)render()})}
  return null;
}

function startKiosk(){
  if(!_kiosk||_kiosk.branch!==state.branch){
    stopKiosk();
    _kiosk={branch:state.branch,token:null,until:0,tick:0};
    if('wakeLock' in navigator)navigator.wakeLock.request('screen').then(l=>{if(_kiosk)_kiosk.lock=l}).catch(()=>{});
    _kiosk.t=setInterval(()=>kioskTick(false),1000);
  }
  kioskDraw();kioskTick(true);
}
async function kioskTick(force){
  const k=_kiosk;if(!k)return;
  const clock=document.getElementById('kiosk-clock');if(clock)clock.textContent=new Date().toLocaleTimeString('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const left=Math.max(0,(k.until-Date.now())/1000),bar=document.getElementById('kiosk-bar');if(bar)bar.style.width=Math.min(100,left/30*100)+'%';
  if((!k.token||left<=1)&&!k.busy){
    k.busy=true;
    try{const{data,error}=await sb.rpc('kiosk_token',{p_branch:k.branch});if(error)throw error;if(_kiosk!==k)return;k.token=data.token;k.name=data.branch_name;k.until=Date.now()+Math.max(5,data.seconds_left)*1000;k.err=null}
    catch(e){k.err=errMsg(e);k.until=Date.now()+5000}
    finally{k.busy=false}
    kioskDraw();
  }
  if(force||++k.tick%10===0)kioskRecent();
}
async function kioskDraw(){
  const el=document.getElementById('kiosk-qr'),k=_kiosk;if(!el||!k)return;
  if(k.err){el.innerHTML=`<div style="color:var(--danger);font-weight:700">${esc(k.err)}</div>`;return}
  if(!k.token)return;
  try{await loadScript(QR_LIB)}catch(e){el.innerHTML=`<div style="color:var(--danger)">${esc(e.message)}</div>`;return}
  const url=location.origin+location.pathname+'?c='+encodeURIComponent(k.token);
  const qr=qrcode(0,'M');qr.addData(url);qr.make();
  el.innerHTML=qr.createSvgTag(8,2);el.dataset.url=url;
  const n=document.getElementById('kiosk-branch');if(n&&k.name)n.textContent=k.name;
}
async function kioskRecent(){

function capturePendingCheckin(){
  const c=new URLSearchParams(location.search).get('c');
  if(c){sessionStorage.setItem('ek_checkin',JSON.stringify({c,t:Date.now()}));history.replaceState(null,'',location.pathname)}
}
function hasPendingCheckin(){return!!sessionStorage.getItem('ek_checkin')}
function takePendingCheckin(){try{const v=JSON.parse(sessionStorage.getItem('ek_checkin')||'null');sessionStorage.removeItem('ek_checkin');return v}catch{return null}}
async function handlePendingCheckin(){
  if(!state.loggedIn||!hasPendingCheckin())return;
  const p=takePendingCheckin();if(!p)return;
  if(!state.user.empId){showToast('هذا الحساب غير مرتبط بموظف — لا يمكن تسجيل الحضور به','error');return}
  state.page='mycheckin';
  await doCheckin(p.c);
}
function getPosition(){return new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),()=>res(null),{enableHighAccuracy:true,timeout:12000,maximumAge:0})})}
async function doCheckin(token,kind){
  state.checkin={status:'working'};render();
  // no GPS prompt / wait when the location check is off for this employee or this branch (the server decides anyway)
  const me=empRecord(state.user.empId),tb=String(token).split('.')[0],br=branches.find(x=>x.id===tb);
  const pos=(me&&me.noGeo)||(br&&br.geo===false)?null:await getPosition();
  const{data,error}=await sb.rpc('emp_check',{p_token:token,p_lat:pos?pos.lat:null,p_lng:pos?pos.lng:null,p_kind:kind||null});
  if(error){const m=String(error.message).match(/choose_kind:(\d{1,2}:\d{2})/);state.checkin=m?{status:'choose',since:m[1],token}:{status:'error',msg:checkinErr(error.message)}}
  else state.checkin={status:'ok',...data};
  delete cache.mycheckins;delete cache.checkins;
  await ensureAtt(true);
  render();
}
function checkinErr(m){
  if(/expired_code/.test(m))return'انتهت صلاحية الكود ⏱️ — امسح الكود الظاهر على الشاشة الآن مرة أخرى';
  if(/invalid_code/.test(m))return'كود غير صحيح — امسح الكود من شاشة الفرع مباشرة';
  if(/wrong_branch/.test(m))return'هذا الكود خاص بفرع آخر غير فرعك';
  if(/location_required/.test(m))return'يجب السماح للمتصفح بمعرفة موقعك — فعّل الموقع (GPS) واسمح للموقع ثم امسح الكود مرة أخرى';
  const f=m.match(/too_far:(\d+)/);if(f)return`أنت بعيد عن الفرع (حوالي ${fmtNum(+f[1])} متر) — يجب أن تكون داخل الصيدلية`;
  if(/too_soon/.test(m))return'تم تسجيلك بالفعل منذ أقل من دقيقة ✓';
  if(/already_out/.test(m))return'تم تسجيل الانصراف لهذه الوردية بالفعل';
  if(/already_requested/.test(m))return'يوجد طلب لهذه الوردية في انتظار الموافقة';
  if(/bad_time/.test(m))return'الوقت غير صحيح — يجب أن يكون بعد وقت الحضور وخلال 16 ساعة، وليس في المستقبل';
  return errMsg({message:m});
}
// Pair check-ins/outs per employee and per day (Cairo time).
function summarizeCheckins(rows){
  const by={};rows.forEach(r=>{(by[r.emp_id]=by[r.emp_id]||[]).push(r)});
  const out={};
  Object.entries(by).forEach(([id,list])=>{
    list.sort((a,b)=>new Date(a.at)-new Date(b.at));
    const days={};let open=null,mins=0;
    const day=d=>days[d]||(days[d]={date:d,firstIn:null,lastOut:null,mins:0});
    list.forEach(r=>{
      if(r.kind==='in'){const d=day(cairo(r.at).date);if(!d.firstIn)d.firstIn=r.at;open=r}
      else if(open){const m=Math.min(16*60,(new Date(r.at)-new Date(open.at))/60000);const d=day(cairo(open.at).date);d.mins+=m;d.lastOut=r.at;mins+=m;open=null}
    });
    out[id]={name:list[0].emp_name,days:Object.values(days).sort((a,b)=>a.date<b.date?-1:1),mins,open:!!open};
  });
  return out;
}
function lateMinutesFor(firstIn,sched,grace){
  if(!firstIn||!/^\d{1,2}:\d{2}$/.test(sched||''))return 0;
  const c=cairo(firstIn),[h,m]=sched.split(':').map(Number);let diff=(c.hh*60+c.mm)-(h*60+m);
  if(diff<-720)diff+=1440; // night shifts: scheduled 23:00, arrived 00:20 next day
  return diff>grace?diff:0;
}

async function fillAttendanceFromCheckins(){
  let rows;try{rows=await loadCheckins(false)}catch(e){showToast(errMsg(e),'error');return}
  const sum=summarizeCheckins(rows),grace=+(curBranch().grace??10);
  const ids=Object.keys(sum).filter(id=>employees.some(e=>e.id===id));
  if(!ids.length){showToast('لا توجد تسجيلات بالكود لهذا الشهر','info');return}
  if(!confirm(`سيتم استبدال الحضور والتأخير وساعات العمل لـ ${ids.length} موظف لشهر ${MONTHS_AR[state.month]} بما في سجل الحضور بالكود. متابعة؟`))return;
  const mk=monthKey();
  if(!attendance[mk])attendance[mk]={};
  if(!monthlyData[mk])monthlyData[mk]={sales:0,gp:0,np:0,hours:{},empSales:{}};
  if(!monthlyData[mk].hours)monthlyData[mk].hours={};
  ids.forEach(id=>{
    const e=employees.find(x=>x.id===id),s=sum[id];let late=0,lm=0;
    s.days.forEach(d=>{const x=lateMinutesFor(d.firstIn,e.scheduledTime,grace);if(x){late++;lm+=x}});
    const total=s.days.length;
    attendance[mk][id]={total,onTime:total-late,late,lateHours:Math.floor(lm/60),lateMinutes:lm%60};
    monthlyData[mk].hours[id]=Math.round(s.mins/60*100)/100;
  });
  saveAll();render();showToast('تم تحديث الحضور والساعات من السجل ✓');
}

function excuseWarnOk(name,used,mk){return used<LATE_WARN||confirm(`⚠️ تنبيه: ${name} استخدم ${used} أذونات تأخير في ${mkLabel(mk)} (المعتاد ${LATE_WARN} فقط).\nهذا سيكون الإذن رقم ${used+1}. هل تريد المتابعة؟`)}
function excusesUsed(empId,mk,rows){return excusesOf(empId,mk).length+(rows||[]).filter(r=>r.emp_id===empId&&r.kind===LATE_KIND&&r.status==='pending'&&payMonthKeyOf(r.from_date)===mk).length}
// staff: record / remove an approved excuse in every branch (that this user can save) where the employee is on the staff list
function excuseBranches(empId){return Object.keys(branchData).filter(b=>(isOwner()||b===state.branch)&&(b===state.branch?employeesAll:(branchData[b].employees||[])).some(e=>e.id===empId))}
function addExcuse(empId,date,info){const mk=payMonthKeyOf(date);excuseBranches(empId).forEach(b=>{const md=b===state.branch?monthlyData:(branchData[b].monthly_data||(branchData[b].monthly_data={}));
  const d=md[mk]||(md[mk]={sales:0,gp:0,np:0,hours:{},empSales:{}}),le=d.lateExcuse||(d.lateExcuse={}),list=le[empId]||(le[empId]=[]);
  if(!list.some(x=>x.date===date))list.push({date,...info})})}
function removeExcuse(empId,date){const mk=payMonthKeyOf(date);excuseBranches(empId).forEach(b=>{const d=mdOf(b)[mk];const le=d&&d.lateExcuse;if(le&&le[empId]){le[empId]=le[empId].filter(x=>x.date!==date);if(!le[empId].length)delete le[empId]}})}

const ITEM_NAMES={withdrawals:'المسحوبات',employees:'بيانات الموظفين',kpi_weights:'أوزان KPI',monthly_data:'المبيعات والساعات',attendance:'الحضور',missions:'المهام',messages:'الرسائل',bonuses:'المكافآت',penalties:'الجزاءات',quarterly_targets:'الأهداف',shift_schedule:'الورديات',commission_tiers:'شرائح العمولة'};
function itemLabel(id){
  if(id==='branches')return'الفروع';
  const i=(id||'').indexOf('/');if(i<0)return id||'';
  const a=id.slice(0,i),b=id.slice(i+1);
  if(a==='leaves')return'الإجازات — '+branchName(b);
  if(a==='checkins')return'سجل الحضور — '+branchName(b);
  return(ITEM_NAMES[b]||b)+' — '+branchName(a);
}
function monthLabels(s){return String(s||'').replace(/\b(\d{4})-(\d{1,2})\b/g,(_,y,m)=>MONTHS_AR[+m]?`${MONTHS_AR[+m]} ${y}`:_)}

function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
async function backupExcel(){
  showToast('⏳ جاري تجهيز ملف Excel…','info');
  try{await loadScript(XLSX_LIB)}catch(e){showToast(e.message,'error');return}
  const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
  const add=(name,rows)=>{XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{'—':'لا توجد بيانات'}]),name.slice(0,31))};
  const label=mk=>{const[y,m]=mk.split('-').map(Number);return`${MONTHS_AR[m]} ${y}`};
  const months=Object.keys(monthlyData).sort((a,b)=>{const[ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return ay-by||am-bm});
  add('الموظفون',employees.map(e=>({'الكود':e.id,'الاسم':e.name,'الدور':e.role,'الوردية':e.shift,'سعر الساعة':e.hourRate,'العمولة %':e.commPct,'وقت الحضور':e.scheduledTime,'مكافأة ثابتة':e.fixedBonus||0})));
  add('المبيعات',months.map(mk=>{const d=getMonthData(mk);return{'الشهر':label(mk),'المبيعات':d.sales||0,'إجمالي الربح':d.gp||0,'صافي الربح':d.np||0,'نسبة العمولة %':calcCommission(d.sales||0,mk).rate}}));
  add('الرواتب',months.flatMap(mk=>employees.map(e=>{const s=empMonthStats(e,mk);return{'الشهر':label(mk),'الموظف':e.name,'الساعات':s.hrs,'الراتب':+s.sal.toFixed(2),'العمولة':+s.comm.toFixed(2),'المكافآت':s.bt,'الجزاءات':s.pt,'المسحوبات':s.wd||0,'الصافي':+s.net.toFixed(2),'KPI':s.kpi}})));
  add('المسحوبات',Object.keys(withdrawals||{}).flatMap(mk=>(withdrawals[mk]||[]).map(x=>({'الشهر':label(mk),'التاريخ':x.date,'الموظف':(employees.find(e=>e.id===x.empId)||{}).name||x.empId,'النوع':x.type,'المبلغ':+x.amount,'ملاحظة':x.note||'','أضافها':x.by||''}))));
  add('الحضور',Object.keys(attendance).flatMap(mk=>Object.entries(attendance[mk]||{}).map(([id,a])=>({'الشهر':label(mk),'الموظف':(employees.find(e=>e.id===id)||{}).name||id,'الأيام':a.total,'في الموعد':a.onTime,'متأخر':a.late,'ساعات التأخير':a.lateHours,'دقائق التأخير':a.lateMinutes}))));
  try{
    const{data:ci}=await sb.from('checkins').select('emp_name,kind,at,dist_m').eq('branch',state.branch).order('at',{ascending:false}).limit(5000);
    add('سجل الحضور بالكود',(ci||[]).map(r=>({'التاريخ':cairo(r.at).date,'الوقت':fmtTime(r.at),'الموظف':r.emp_name,'النوع':r.kind==='in'?'حضور':'انصراف','المسافة (م)':r.dist_m??''})));
    const{data:lv}=await sb.from('leave_requests').select('*').eq('branch',state.branch).order('created_at',{ascending:false}).limit(2000);
    add('الإجازات',(lv||[]).map(r=>({'الموظف':r.emp_name,'النوع':r.kind,'من':r.from_date,'إلى':r.to_date,'الأيام':leaveDays(r),'الحالة':r.status==='approved'?'موافق':r.status==='rejected'?'مرفوض':'انتظار','ملاحظة':r.note||''})));
  }catch(e){console.warn(e)}
  XLSX.writeFile(wb,`elkareem-${state.branch}-${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('تم تحميل ملف Excel ✓');
}
async function backupJSON(){

    if(a.error)throw a.error;

function collectBranchInputs(){
  document.querySelectorAll('.br-name').forEach(i=>{const b=branches.find(x=>x.id===i.dataset.id);if(b&&i.value.trim())b.name=i.value.trim()});
  document.querySelectorAll('.br-geo').forEach(i=>{const b=branches.find(x=>x.id===i.dataset.id);if(b)b.geo=i.checked});
  document.querySelectorAll('.br-radius').forEach(i=>{const b=branches.find(x=>x.id===i.dataset.id);if(b)b.radius=Math.max(30,+i.value||150)});
  document.querySelectorAll('.br-grace').forEach(i=>{const b=branches.find(x=>x.id===i.dataset.id);if(b)b.grace=Math.max(0,+i.value||0)});
  document.querySelectorAll('.br-shift').forEach(i=>{const b=branches.find(x=>x.id===i.dataset.id);if(b)b.shift=Math.min(16,Math.max(1,+i.value||8))});
  document.querySelectorAll('.br-free').forEach(i=>{const b=branches.find(x=>x.id===i.dataset.id);if(b)b.free_forgets=Math.max(0,Math.round(+i.value||0))});
  document.querySelectorAll('.br-pen').forEach(i=>{const b=branches.find(x=>x.id===i.dataset.id);if(b)b.forget_penalty=Math.max(0,+i.value||0)});
}

      <p style="color:var(--text2);font-size:12px;margin-bottom:12px">لحالات خاصة (مثلاً تعطل الموبايل). لا تُحسب كمرة نسيان، وتظهر في سجل التغييرات.</p>

      <p style="margin-bottom:12px">حضرت يوم <strong>${fmtDay(cairo(m.inAt).date)}</strong> الساعة <strong dir="ltr">${fmtTime(m.inAt)}</strong>. متى خرجت؟</p>

      <div class="modal-footer"><button class="btn btn-ghost" id="modal-cancel-2">إلغاء</button><button class="btn btn-primary" id="fx-save">📨 إرسال</button></div>`;
  } else if(m.type==='credentials'){
    content=`<div class="modal-header"><h3>🔐 بيانات الدخول</h3><button class="modal-close" id="modal-cancel">✕</button></div>
      <div style="background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.25);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--gold2)">⚠️ انسخ أو اطبع هذه القائمة الآن — لن تظهر كلمات المرور مرة أخرى. أعطِ كل موظف بياناته فقط.</div>
      <div class="table-wrap" id="creds-table"><table><thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>كلمة المرور</th></tr></thead><tbody>${m.list.map(c=>`<tr><td style="font-weight:700">${esc(c.name)}</td><td dir="ltr" style="font-family:monospace">${esc(c.username)}</td><td dir="ltr" style="font-family:monospace;color:var(--gold2)">${c.error?`<span style="color:var(--danger)">${esc(c.error)}</span>`:esc(c.password)}</td></tr>`).join('')}</tbody></table></div>
