// ══════════════════════════════════════════════
//  EVENT BINDING
// ══════════════════════════════════════════════
function bindEvents(){
  try{CRM.bind()}catch(e){console.error('CRM',e)} // CRM
  try{FIN.bind()}catch(e){console.error('FIN',e)} // المالية
  try{NOTIF.bind()}catch(e){console.error('NOTIF',e)} // الإشعارات
  // Nav
  document.querySelectorAll('.nav-item[data-page]').forEach(el=>{el.onclick=()=>{state.page=el.dataset.page;render()}});
  document.getElementById('logout-btn')?.addEventListener('click',doLogout);
  document.getElementById('top-logout-btn')?.addEventListener('click',()=>{if(confirm('تسجيل الخروج من التطبيق؟'))doLogout()});
  document.getElementById('hamburger-btn')?.addEventListener('click',()=>{
    const sb2=document.getElementById('sidebar');
    if(window.innerWidth<=640){sb2.classList.toggle('open')}else{state.sidebarOpen=!state.sidebarOpen;render()}
  });
  document.getElementById('year-sel')?.addEventListener('change',e=>{state.year=+e.target.value;render();ensureAtt().then(()=>{render();if(isStaff())saveAll()})});
  const switchBranch=b=>{if(!branchData[b]||b===state.branch)return;useBranch(b);lss('branch',b);state.checkin=null;render()};
  document.getElementById('branch-sel')?.addEventListener('change',e=>switchBranch(e.target.value));
  document.querySelectorAll('[data-switch-branch]').forEach(el=>{el.onclick=()=>switchBranch(el.dataset.switchBranch)});
  document.querySelectorAll('[data-payslip]').forEach(btn=>{btn.onclick=()=>printPayslip(btn.dataset.payslip)});
  // Daily sales
  document.getElementById('save-daily-btn')?.addEventListener('click',()=>{
    const mk=monthKey(),daily={};
    document.querySelectorAll('.daily-inp').forEach(i=>{const v=i.value.trim();if(v!==''&&+v>=0)daily[i.dataset.day]=+v});
    if(!monthlyData[mk])monthlyData[mk]={sales:0,gp:0,np:0,hours:{},empSales:{}};
    if(Object.keys(daily).length){monthlyData[mk].daily=daily;monthlyData[mk].sales=Object.values(daily).reduce((s,v)=>s+v,0)}else delete monthlyData[mk].daily;
    saveAll();render();showToast('تم حفظ المبيعات اليومية ✓ — الإجمالي تحدّث');
  });
  // Remove / restore employees
  const dropAccounts=async empId=>{for(const u of users.filter(x=>x.empId===empId)){const{error}=await sb.rpc('admin_delete_user',{p_uid:u.id});if(error)throw error}await loadUsers()};
  const purgeEmp=async empId=>{
    const e=employeesAll.find(x=>x.id===empId);if(!e)return;
    if(!confirm(`حذف «${e.name}» نهائياً من كل الشهور؟ لا يمكن التراجع.`))return;
    try{if(isOwner()&&!e.home)await dropAccounts(empId)}catch(err){showToast(errMsg(err),'error');return}
    employeesAll=employeesAll.filter(x=>x.id!==empId);refreshEmpView();
    const vid=e.home?`${empId}@${state.branch}`:empId;sb.from('emp_view').delete().eq('emp_id',vid).then(()=>{});delete _viewSynced[vid];
    state.modal=null;saveAll();render();showToast('تم الحذف النهائي');
  };
  document.querySelectorAll('[data-move-emp]').forEach(b=>{b.onclick=()=>{state.modal={type:'move-emp',empId:b.dataset.moveEmp};render()}});
  document.getElementById('mv-save')?.addEventListener('click',async ev=>{
    const from=state.branch,e=employeesAll.find(x=>x.id===state.modal.empId),to=document.getElementById('mv-to').value,start=document.getElementById('mv-start').value;
    if(!e||!branchData[to])return;
    if(isOwner()&&!confirm(`نقل ${e.name} إلى ${branchName(to)}؟`))return;
    ev.target.disabled=true;
    try{for(const u of users.filter(x=>x.empId===e.id)){const{error}=await sb.from('profiles').update({branch:to}).eq('id',u.id);if(error)throw error}}
    catch(err){ev.target.disabled=false;showToast(errMsg(err),'error');return}
    const[y,m]=start.split('-').map(Number),pd=new Date(y,m-1,1);
    const list=branchData[to].employees||(branchData[to].employees=[]);let t=list.find(x=>x.id===e.id);
    if(t){delete t.home;delete t.leftMk;delete t.movedTo}   // already worked there as a second branch: that record becomes the main one
    else{t=clone(e);delete t.leftMk;delete t.movedTo;delete t.home;list.push(t)}
    Object.keys(branchData).forEach(b=>{if(b!==from&&b!==to)(branchData[b].employees||[]).forEach(x=>{if(x.id===e.id&&x.home===from)x.home=to})});
    e.leftMk=`${pd.getFullYear()}-${pd.getMonth()}`;e.movedTo=to;refreshEmpView();
    await loadUsers().catch(()=>{});
    state.modal=null;saveAll();render();showToast(`تم نقل ${e.name} إلى ${branchName(to)} ✓ — من ${MONTHS_AR[m]} ${y}`);
  });
  document.querySelectorAll('[data-remove-emp]').forEach(b=>{b.onclick=()=>{state.modal={type:'remove-emp',empId:b.dataset.removeEmp};render()}});
  document.querySelectorAll('[data-purge-emp]').forEach(b=>{b.onclick=()=>purgeEmp(b.dataset.purgeEmp)});
  document.querySelectorAll('[data-restore-emp]').forEach(b=>{b.onclick=()=>{const e=employeesAll.find(x=>x.id===b.dataset.restoreEmp);if(!e)return;delete e.leftMk;refreshEmpView();saveAll();render();showToast(`تم إرجاع ${e.name} ✓ — أنشئ له حساب دخول من الإعدادات إذا لزم`)}});
  document.getElementById('rm-purge')?.addEventListener('click',()=>purgeEmp(state.modal.empId));
  document.getElementById('rm-archive')?.addEventListener('click',async ev=>{
    const e=employeesAll.find(x=>x.id===state.modal.empId);if(!e)return;
    ev.target.disabled=true;
    try{if(document.getElementById('rm-acc')?.checked)await dropAccounts(e.id)}catch(err){ev.target.disabled=false;showToast(errMsg(err),'error');return}

          if(cb.checked){if(!c){list.push({...clone(emp),home:state.branch,fixedBonus:0,bonusName:''});added.push(b)}else if(c.leftMk||c.home!==state.branch){delete c.leftMk;delete c.movedTo;c.home=state.branch;added.push(b)}}
          else if(c&&!c.leftMk&&c.home===state.branch){c.leftMk=monthKey();removed.push(b)}});
        Object.keys(branchData).forEach(b=>{if(b!==state.branch)(branchData[b].employees||[]).forEach(x=>{if(x.id===emp.id&&x.home===state.branch){x.name=emp.name;x.role=emp.role}})});
        saveAll();state.modal=null;render();
        showToast('تم حفظ بيانات الموظف ✓'+(added.length?` — أُضيف إلى ${added.map(branchName).join('، ')} (عدّل سعر الساعة والعمولة من ذلك الفرع)`:'')+(removed.length?` — أُزيل من ${removed.map(branchName).join('، ')} بعد هذا الشهر`:''));
      });
    } else if(mm.type==='edit-user'||mm.type==='add-user'){
      document.getElementById('gen-pass-btn')?.addEventListener('click',()=>{document.getElementById('user-newpass').value=genPassword()});
      document.getElementById('user-emp')?.addEventListener('change',e=>{const o=e.target.selectedOptions[0],bs=document.getElementById('user-branch');if(o&&o.dataset.branch)bs.value=o.dataset.branch;bs.disabled=!!e.target.value});
      document.getElementById('modal-save-user')?.addEventListener('click',async()=>{
        const isNew=mm.type==='add-user',errEl=document.getElementById('user-edit-err'),btn=document.getElementById('modal-save-user');
        const newU=document.getElementById('user-username').value.trim().toLowerCase(),newN=document.getElementById('user-display-name').value.trim(),newP=document.getElementById('user-newpass').value.trim();
        const role=document.getElementById('user-role').value,empSel=document.getElementById('user-emp'),empId=empSel.value||null;
        const branch=role==='owner'?null:(empId?empSel.selectedOptions[0].dataset.branch:document.getElementById('user-branch').value);
        if(!/^[a-z0-9._-]{3,30}$/.test(newU)){errEl.textContent=ERR_AR.invalid_username;return}
        if((isNew||newP)&&newP.length<6){errEl.textContent=ERR_AR.password_too_short;return}
        if(users.some(u=>u.username===newU&&(isNew||u.id!==mm.user.id))){errEl.textContent=ERR_AR.username_taken;return}
        if((role==='employee'||role==='senior')&&!empId&&!confirm('هذا الحساب غير مرتبط بموظف — لن يرى بيانات أداء ولن يستطيع تسجيل الحضور. متابعة؟'))return;
        btn.disabled=true;errEl.textContent='';
        try{
          if(isNew){
            const{error}=await sb.rpc('admin_create_user',{p_username:newU,p_password:newP,p_name:newN||newU,p_role:role,p_emp_id:empId,p_pages:rolePages(role),p_branch:branch});
            if(error)throw error;
            await loadUsers();
            state.modal={type:'credentials',list:[{name:newN||newU,username:newU,password:newP}]};render();
            return;
          }
          const u=mm.user;
          if(newU!==u.username){const{error}=await sb.rpc('admin_set_username',{p_uid:u.id,p_username:newU});if(error)throw error}
          if(newP){const{error}=await sb.rpc('admin_set_password',{p_uid:u.id,p_password:newP});if(error)throw error}
          const upd={name:newN||newU,emp_id:empId};
          if(u.id!==state.user.id){upd.role=role;upd.branch=branch}
          if(upd.role&&upd.role!==u.role)upd.pages=rolePages(upd.role);
          const{error}=await sb.from('profiles').update(upd).eq('id',u.id);if(error)throw error;
          await loadUsers();
          if(u.id===state.user.id){const me=users.find(x=>x.id===u.id);if(me)Object.assign(state.user,me)}
          state.modal=newP?{type:'credentials',list:[{name:newN||newU,username:newU,password:newP}]}:null;
          render();showToast('تم حفظ بيانات المستخدم ✓');
        }catch(e){btn.disabled=false;errEl.textContent=errMsg(e)}
      });
    } else if(mm.type==='add-checkin'){
      document.getElementById('ac-save')?.addEventListener('click',async e=>{
        const v=document.getElementById('ac-at').value;if(!v){showToast('اختر الوقت','error');return}
        e.target.disabled=true;
        const{error}=await sb.rpc('staff_add_checkin',{p_branch:state.branch,p_emp:document.getElementById('ac-emp').value,p_kind:document.getElementById('ac-kind').value,p_at:new Date(v).toISOString(),p_note:document.getElementById('ac-note').value.trim()});
        if(error){e.target.disabled=false;showToast(checkinErr(error.message),'error');return}
        state.modal=null;delete cache.checkins;await ensureAtt(true);saveAll();render();showToast('تمت الإضافة ✓');
      });
    } else if(mm.type==='fix-out'){
      document.getElementById('fx-save')?.addEventListener('click',async e=>{
        const v=document.getElementById('fx-at').value;if(!v){showToast('اختر الوقت','error');return}
        e.target.disabled=true;
        const{error}=await sb.rpc('emp_request_fix',{p_in_id:mm.inId,p_out_at:new Date(v).toISOString(),p_note:document.getElementById('fx-note').value.trim()});
        if(error){e.target.disabled=false;showToast(checkinErr(error.message),'error');return}
        state.modal=null;await loadFixes();render();showToast('تم إرسال الطلب ✓');
      });
    } else if(mm.type==='credentials'){
      document.getElementById('copy-creds-btn')?.addEventListener('click',()=>{
        const txt=mm.list.filter(c=>!c.error).map(c=>`${c.name}\t${c.username}\t${c.password}`).join('\n')+`\n\n${location.origin+location.pathname}`;
        navigator.clipboard.writeText(txt).then(()=>showToast('تم النسخ ✓'),()=>showToast('تعذّر النسخ — استخدم الطباعة','error'));
      });
      document.getElementById('print-creds-btn')?.addEventListener('click',()=>{
        const w=window.open('','_blank');if(!w){showToast('اسمح بالنوافذ المنبثقة للطباعة','error');return}
        w.document.write(`<html dir="rtl"><head><meta charset="utf-8"><title>بيانات الدخول</title><style>body{font-family:sans-serif;padding:24px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:8px;text-align:right}td.l{direction:ltr;font-family:monospace;text-align:left}</style></head><body><h2>بيانات الدخول — مجموعة الكريم</h2><p>الرابط: ${esc(location.origin+location.pathname)}</p><table><tr><th>الاسم</th><th>اسم المستخدم</th><th>كلمة المرور</th></tr>${mm.list.filter(c=>!c.error).map(c=>`<tr><td>${esc(c.name)}</td><td class="l">${esc(c.username)}</td><td class="l">${esc(c.password)}</td></tr>`).join('')}</table></body></html>`);
        w.document.close();w.focus();w.print();
      });
    } else if(mm.type==='edit-perms'){
      document.querySelectorAll('.perm-cb').forEach(cb=>{cb.addEventListener('change',()=>{cb.closest('label').classList.toggle('on',cb.checked)})});
      document.getElementById('perm-all')?.addEventListener('click',()=>{document.querySelectorAll('.perm-cb').forEach(cb=>{cb.checked=true;cb.closest('label').classList.add('on')})});
      document.getElementById('perm-none')?.addEventListener('click',()=>{document.querySelectorAll('.perm-cb').forEach(cb=>{cb.checked=false;cb.closest('label').classList.remove('on')})});
      document.getElementById('modal-save-perms')?.addEventListener('click',async()=>{
        const u=mm.user,selected=[];
        document.querySelectorAll('.perm-cb:checked').forEach(cb=>selected.push(cb.dataset.page));
        const{error}=await sb.from('profiles').update({pages:selected}).eq('id',u.id);
        if(error){showToast(errMsg(error),'error');return}
        await loadUsers();if(u.id===state.user.id)state.user.pages=selected;
        state.modal=null;render();showToast('تم حفظ الصلاحيات ✓');
      });
    }
  }
}

// ══════════════════════════════════════════════
//  IMAGE HELPER
// ══════════════════════════════════════════════
function bindImgInput(inputId,previewId,target){
  const imgInput=document.getElementById(inputId);
  if(!imgInput)return;
  imgInput.addEventListener('change',e=>{const f=e.target.files[0];if(f)loadImg(f,previewId)});
}
function loadImg(file,previewId){
  if(file.size>15*1024*1024){showToast('الصورة أكبر من 15MB','error');return}
  const img=new Image(),objUrl=URL.createObjectURL(file);
  img.onload=function(){
    URL.revokeObjectURL(objUrl);
    const MAX=1400;let w=img.width,h=img.height;
    if(w>MAX){h=Math.round(h*MAX/w);w=MAX}
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    const dataUrl=canvas.toDataURL('image/jpeg',0.82);
    _pendingImg=dataUrl;
    const wrap=document.getElementById(previewId);
    if(wrap)wrap.innerHTML=`<img src="${dataUrl}" style="width:100%;max-height:180px;object-fit:cover;border-radius:8px"><div style="font-size:12px;color:var(--success);margin-top:6px;font-weight:700">✅ تم تحميل الصورة — اضغط حفظ</div>`;
  };
  img.src=objUrl;
}

// ══════════════════════════════════════════════
//  BULK ACCOUNT CREATION (owner)
// ══════════════════════════════════════════════
async function bulkCreateAccounts(){
  const taken=new Set(users.map(u=>u.username)),linked=new Set(users.map(u=>u.empId).filter(Boolean));
  const todo=[];
  (state.branch==='b1'?USERS_DEFAULT:[]).forEach(d=>{
    if(taken.has(d.username))return;
    if(d.empId&&(!employees.some(e=>e.id===d.empId)||linked.has(d.empId)))return;
    const emp=employees.find(e=>e.id===d.empId);
    todo.push({...d,name:emp?emp.name:d.name});taken.add(d.username);if(d.empId)linked.add(d.empId);
  });
  employeesAll.filter(e=>!e.leftMk&&!linked.has(e.id)).forEach(e=>{
    let un=e.id.toLowerCase();while(taken.has(un))un+='x';
    todo.push({username:un,role:'employee',empId:e.id,name:e.name,pages:EMP_PAGES});taken.add(un);linked.add(e.id);
  });
  if(!todo.length){showToast('كل الموظفين لديهم حسابات بالفعل ✓','info');return}
  if(!confirm(`${branchName(state.branch)}\nسيتم إنشاء ${todo.length} حساب بكلمات مرور عشوائية:\n\n${todo.map(t=>`• ${t.name} — ${t.username}`).join('\n')}\n\nمتابعة؟`))return;
  showToast('⏳ جاري إنشاء الحسابات…','info');
  const list=[];
  for(const t of todo){
    const pw=genPassword();
    const{error}=await sb.rpc('admin_create_user',{p_username:t.username,p_password:pw,p_name:t.name,p_role:t.role,p_emp_id:t.empId,p_pages:rolePages(t.role),p_branch:t.role==='owner'?null:state.branch});
    list.push({name:t.name,username:t.username,password:pw,error:error?errMsg(error):null});
  }
  await loadUsers();
  state.modal={type:'credentials',list};render();
}

// ══════════════════════════════════════════════
//  STARTUP
// ══════════════════════════════════════════════
(async function startup(){
  {const p=payMonthOf(cairo(Date.now()).date);state.year=p.y;state.month=p.m} // current pay month
  capturePendingCheckin();
  resetData();
  if(!window.supabase||!initSupabase()){
    document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="login-card" style="text-align:center"><div style="font-size:40px;margin-bottom:10px">📡</div><h3 style="margin-bottom:8px">تعذّر الاتصال</h3><p style="color:var(--text2);font-size:13px">تحقق من اتصال الإنترنت ثم أعد تحميل الصفحة.</p></div></div>`;
    return;
  }
  const{data:{session}}=await sb.auth.getSession();
  if(session){
    state.loading=true;render();
    try{await afterLogin(session)}catch(e){console.error(e);await sb.auth.signOut().catch(()=>{});state.loginError=loginErrMsg(e)}
    state.loading=false;
  }
  render();
  handlePendingCheckin();
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&state.loggedIn)logoutLocal()});
})();
