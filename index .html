<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مجموعة الكريم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--bg2:#0e1420;--bg3:#141c2e;--bg4:#1a2440;
  --accent:#3b6ef5;--accent2:#2553d4;--accent3:#7aa3ff;
  --gold:#f5a623;--gold2:#fbbf24;--gold3:#fde68a;
  --success:#10b981;--success2:#065f46;
  --danger:#ef4444;--danger2:#7f1d1d;
  --warn:#f59e0b;--warn2:#78350f;
  --purple:#8b5cf6;--pink:#ec4899;
  --text:#f0f4ff;--text2:#8fa3c8;--text3:#4a5d7a;
  --border:#1a2d4f;--border2:#243655;
  --card:#0e1420;--card2:#141c2e;
  --radius:14px;--radius2:9px;--radius3:6px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
  --shadow2:0 2px 12px rgba(0,0,0,.3);
  --glow:0 0 20px rgba(59,110,245,.15);
}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:14px}

/* ── SIDEBAR ── */
.sidebar{width:230px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;right:0;height:100vh;overflow-y:auto;z-index:100;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.sidebar.closed{transform:translateX(230px)}
.sidebar-logo{padding:18px 16px 14px;border-bottom:1px solid var(--border);background:linear-gradient(160deg,#0a1535,#142250)}
.sidebar-logo img{max-width:140px;max-height:52px;object-fit:contain;display:block;margin:0 auto 6px}
.sidebar-logo .branch-badge{font-size:10px;color:var(--accent3);text-align:center;background:rgba(59,110,245,.12);border:1px solid rgba(59,110,245,.25);border-radius:20px;padding:2px 10px;display:inline-block;margin:0 auto;display:block;width:fit-content}
.user-badge{padding:12px 14px;border-bottom:1px solid var(--border);background:var(--bg3);display:flex;align-items:center;gap:10px}
.user-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
.user-info .role-badge{font-size:9px;background:var(--accent);color:#fff;padding:2px 7px;border-radius:20px;display:inline-block;margin-bottom:2px}
.user-info .uname{font-size:13px;font-weight:700;line-height:1.2}
.nav-group{padding:6px 0}
.nav-label{font-size:9px;color:var(--text3);padding:8px 16px 4px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;border-right:3px solid transparent;transition:all .15s;color:var(--text2);font-size:13px;font-weight:500;position:relative}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:rgba(59,110,245,.12);border-right-color:var(--accent);color:var(--accent3);font-weight:700}
.nav-item .badge-dot{background:var(--danger);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;margin-right:auto}
.nav-icon{width:22px;text-align:center;font-size:15px}
.sidebar-footer{padding:14px;margin-top:auto;border-top:1px solid var(--border)}

/* ── MAIN ── */
.main{margin-right:230px;display:flex;flex-direction:column;min-height:100vh;transition:margin .3s}
.main.full{margin-right:0}

/* ── TOPBAR ── */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;backdrop-filter:blur(10px)}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar h2{font-size:17px;font-weight:800}
.topbar-right{display:flex;gap:8px;align-items:center}
.sync-indicator{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);padding:4px 10px;border-radius:20px;background:var(--bg3);border:1px solid var(--border)}
.sync-indicator.live{color:var(--success)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text3)}
.sync-indicator.live .sync-dot{background:var(--success);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.content{padding:20px 24px;flex:1}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow2)}
.card-sm{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px}
.stat-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--glow)}
.stat-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.03),transparent);pointer-events:none}
.stat-card .sc-icon{font-size:28px;margin-bottom:8px;display:block}
.stat-card .sc-label{font-size:11px;color:var(--text2);font-weight:600;margin-bottom:4px}
.stat-card .sc-val{font-size:22px;font-weight:800;line-height:1}
.stat-card .sc-sub{font-size:11px;color:var(--text3);margin-top:4px}

/* ── GRIDS ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1100px){.grid-4{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:900px){.grid-4{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}}
@media(max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.sidebar{transform:translateX(230px)}.sidebar.open{transform:translateX(0)}.main{margin-right:0}.content{padding:14px}}

/* ── TABLES ── */
.table-wrap{overflow-x:auto;border-radius:var(--radius2);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg3);padding:10px 14px;text-align:right;color:var(--text2);font-weight:700;font-size:11px;border-bottom:1px solid var(--border);white-space:nowrap;letter-spacing:.3px}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.table-footer td{background:var(--bg3);font-weight:800;border-top:2px solid var(--border2)}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-blue{background:rgba(59,110,245,.2);color:#7aa3ff}
.badge-green{background:rgba(16,185,129,.2);color:#34d399}
.badge-gold{background:rgba(245,166,35,.2);color:#fbbf24}
.badge-red{background:rgba(239,68,68,.2);color:#f87171}
.badge-gray{background:rgba(74,93,122,.2);color:#8fa3c8}
.badge-purple{background:rgba(139,92,246,.2);color:#a78bfa}
.badge-pink{background:rgba(236,72,153,.2);color:#f472b6}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius2);font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 2px 12px rgba(59,110,245,.3)}
.btn-primary:hover{box-shadow:0 4px 20px rgba(59,110,245,.5)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{background:var(--bg3);color:var(--text);border-color:var(--border2)}
.btn-danger{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.25)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-success{background:rgba(16,185,129,.12);color:#34d399;border:1px solid rgba(16,185,129,.25)}
.btn-success:hover{background:rgba(16,185,129,.2)}
.btn-gold{background:rgba(245,166,35,.12);color:#fbbf24;border:1px solid rgba(245,166,35,.25)}
.btn-gold:hover{background:rgba(245,166,35,.2)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-xs{padding:3px 9px;font-size:11px}

/* ── FORMS ── */
input,select,textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius2);color:var(--text);font-family:'Tajawal',sans-serif;font-size:13px;padding:9px 12px;width:100%;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,110,245,.15)}
select option{background:var(--bg2)}
label{font-size:12px;color:var(--text2);font-weight:700;display:block;margin-bottom:5px}
.form-group{margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── LOGIN ── */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,rgba(59,110,245,.12),transparent 70%),var(--bg);padding:20px}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:44px;width:100%;max-width:420px;box-shadow:var(--shadow)}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo img{max-width:180px;max-height:70px;object-fit:contain;margin-bottom:10px}
.login-logo h2{font-size:14px;color:var(--text2);font-weight:500}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:26px;width:100%;max-width:620px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.modal-header h3{font-size:16px;font-weight:800}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;padding:2px;line-height:1;transition:color .15s}
.modal-close:hover{color:var(--text)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}

/* ── NOTIF BARS ── */
.notif-bar{padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:600;border-bottom:1px solid;animation:slideDown .2s ease}
@keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
.notif-bar.type-owner{background:rgba(59,110,245,.1);border-color:rgba(59,110,245,.3);color:var(--accent3)}
.notif-bar.type-success{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3);color:#34d399}
.notif-bar.type-warn{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#f87171}
.notif-bar.type-gold{background:rgba(245,166,35,.1);border-color:rgba(245,166,35,.3);color:var(--gold2)}
.notif-close{margin-right:auto;background:none;border:none;color:inherit;cursor:pointer;font-size:18px;opacity:.7;transition:opacity .15s}
.notif-close:hover{opacity:1}

/* ── KPI ── */
.kpi-bar{background:var(--bg4);border-radius:8px;overflow:hidden;height:7px}
.kpi-fill{height:100%;border-radius:8px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.score-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;width:96px;height:96px;border-radius:50%;border:5px solid;font-size:26px;font-weight:800}

/* ── TOGGLE ── */
.toggle-switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--bg4);border-radius:24px;transition:.2s;border:1px solid var(--border2)}
.toggle-slider:before{position:absolute;content:'';height:16px;width:16px;right:3px;bottom:3px;background:var(--text3);border-radius:50%;transition:.2s}
.toggle-switch input:checked+.toggle-slider{background:var(--success);border-color:var(--success)}
.toggle-switch input:checked+.toggle-slider:before{transform:translateX(-20px);background:#fff}

/* ── SECTION HEADER ── */
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.section-header h3{font-size:15px;font-weight:800}

/* ── IMG UPLOAD ── */
.img-upload-area{border:2px dashed var(--border2);border-radius:var(--radius2);padding:22px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text2)}
.img-upload-area:hover{border-color:var(--accent);background:rgba(59,110,245,.05)}

/* ── HAMBURGER ── */
.hamburger{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px}
@media(max-width:640px){.hamburger{display:block}}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:24px;z-index:999;display:flex;align-items:center;gap:10px;padding:13px 20px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:var(--shadow);animation:toastIn .25s ease;max-width:340px}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast-success{background:#065f46;color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}
.toast-error{background:#7f1d1d;color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.toast-info{background:#1e3a5f;color:#93c5fd;border:1px solid rgba(59,130,246,.3)}

/* ── PRINT ── */
@media print{
  .sidebar,.topbar,.topbar-right,.hamburger,.notif-bar,.no-print{display:none!important}
  .main{margin-right:0!important}
  .content{padding:0!important}
  body{background:#fff;color:#000}
  .card,.card-sm,.stat-card{background:#fff!important;border:1px solid #ddd!important;box-shadow:none!important}
  th{background:#f5f5f5!important;color:#333!important}
  td{color:#333!important}
}

/* ── SETUP SCREEN ── */
.setup-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);padding:20px}
.setup-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:40px;width:100%;max-width:560px;box-shadow:var(--shadow)}
.setup-card h2{font-size:22px;font-weight:800;margin-bottom:6px;color:var(--gold2)}
.setup-card .step{display:flex;gap:12px;align-items:flex-start;margin-bottom:20px;padding:14px;background:var(--bg3);border-radius:var(--radius2);border:1px solid var(--border)}
.setup-card .step-num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.setup-card code{background:var(--bg4);padding:2px 7px;border-radius:4px;font-family:monospace;font-size:12px;color:var(--accent3)}

/* ── PROGRESS BAR ── */
.progress-bar{background:var(--bg4);border-radius:8px;overflow:hidden;height:10px;margin-top:6px}
.progress-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .6s}

/* ── PERM ITEM ── */
.perm-item{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:12px;cursor:pointer;transition:all .15s}
.perm-item.on{border-color:var(--accent);background:rgba(59,110,245,.08);color:var(--text)}
.perm-item input{width:auto;margin:0}

/* ── LEADERBOARD PODIUM ── */
.podium-card{background:var(--bg3);border:2px solid var(--border2);border-radius:16px;padding:20px 14px;text-align:center;transition:all .2s;position:relative}
.podium-card.rank-1{border-color:var(--gold);box-shadow:0 0 24px rgba(245,166,35,.2)}
.podium-card.rank-2{border-color:#94a3b8}
.podium-card.rank-3{border-color:#92400e}

/* ── INLINE STATS ROW ── */
.stats-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.stats-row-item{flex:1;min-width:80px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:10px;text-align:center}
.stats-row-item .val{font-size:18px;font-weight:800}
.stats-row-item .lbl{font-size:10px;color:var(--text3);margin-top:2px}

/* ── SHIFT PLANNER ── */
.shift-grid{display:grid;grid-template-columns:160px repeat(7,1fr);gap:1px;background:var(--border)}
.shift-cell{background:var(--bg2);padding:8px 6px;text-align:center;font-size:11px}
.shift-cell.header{background:var(--bg3);font-weight:700;color:var(--text2);font-size:10px}
.shift-cell.emp-name{text-align:right;font-weight:600;padding-right:12px}
.shift-block{border-radius:6px;padding:3px 6px;font-size:10px;font-weight:700;cursor:pointer;transition:opacity .15s}
.shift-block:hover{opacity:.8}
.shift-am{background:rgba(59,110,245,.25);color:#93c5fd}
.shift-pm{background:rgba(245,166,35,.25);color:#fcd34d}
.shift-off{background:rgba(74,93,122,.15);color:var(--text3)}
.shift-split{background:rgba(16,185,129,.25);color:#6ee7b7}
</style>
</head>

<div id="app"></div>

<script>
// ══════════════════════════════════════════════
//  SUPABASE CONFIG
//  The publishable key is meant to be public: access is controlled by the
//  login + database rules in supabase-setup.sql.
// ══════════════════════════════════════════════
const SUPABASE_URL = 'https://hxckdhdwafdxjntuohlw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_jQBQuv-pIhHqEDHw7DbL4Q_EPcYvsSO';
const LOGIN_DOMAIN = 'elkareem-staff.app'; // must match _login_email() in supabase-setup.sql

// ══════════════════════════════════════════════

// Only device preferences (dismissed notifications) are kept on the device.
// Business data is never cached locally, so a shared computer leaks nothing after logout.
function ls(k){try{return JSON.parse(localStorage.getItem('ek7_'+k))}catch{return null}}
function lss(k,v){localStorage.setItem('ek7_'+k,JSON.stringify(v))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeImg(s){return typeof s==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s)?s:''}
function clone(o){return JSON.parse(JSON.stringify(o))}
// Key-order-independent JSON, used to detect what actually changed.
function stableStr(v){if(v===null||typeof v!=='object')return JSON.stringify(v)??'null';if(Array.isArray(v))return'['+v.map(stableStr).join(',')+']';return'{'+Object.keys(v).sort().filter(k=>v[k]!==undefined&&typeof v[k]!=='function').map(k=>JSON.stringify(k)+':'+stableStr(v[k])).join(',')+'}'}
function loginEmail(u){return u.trim().toLowerCase()+'@'+LOGIN_DOMAIN}
function genPassword(){const c='abcdefghjkmnpqrstuvwxyz23456789';const a=new Uint32Array(8);crypto.getRandomValues(a);return Array.from(a,x=>c[x%c.length]).join('')}

function calcCommission(sales){

  if(sales>=760000)return{rate:1.5,pool:sales*0.015,label:'مبيعات عالية (1.5%)'};
  if(sales>=691000)return{rate:1,pool:sales*0.01,label:'مبيعات جيدة (1%)'};
  if(sales>=662400)return{rate:0.5,pool:sales*0.005,label:'مبيعات عند الحد (0.5%)'};
  return{rate:0,pool:0,label:'أقل من حد العمولة'};
}
function calcSalary(emp,hrs){return(emp.hourRate/26)*hrs}
function kpiColor(s){if(s>=90)return'#10b981';if(s>=80)return'#3b82f6';if(s>=70)return'#f59e0b';if(s>=60)return'#f97316';return'#ef4444'}
function kpiLabel(s){if(s>=90)return'متميز';if(s>=80)return'مرتفع';if(s>=70)return'جيد';if(s>=60)return'مقبول';return'يحتاج تحسين'}
function fmtNum(n,dec=0){return Number(n||0).toLocaleString('ar-EG',{minimumFractionDigits:dec,maximumFractionDigits:dec})}
function monthToQuarter(m){if(m<=2)return'Q1';if(m<=5)return'Q2';if(m<=8)return'Q3';return'Q4'}
function monthKey(){return`${state.year}-${state.month}`}
function getMonthData(mk=monthKey()){const d=monthlyData[mk]||{};return{sales:0,gp:0,np:0,...d,hours:d.hours||{},empSales:d.empSales||{}}}
function getEmpBonuses(empId,mk){
  const b=bonuses[mk]||[];const emp=employees.find(e=>e.id===empId);
  let total=0,list=[];
  b.filter(x=>x.empId===empId).forEach(x=>{list.push(x);total+=Number(x.amount)});
  if(emp&&emp.fixedBonus){list.push({name:emp.bonusName||'مكافأة',amount:emp.fixedBonus,visible:true});total+=emp.fixedBonus}
  return{list,total}
}
function getEmpPenalties(empId,mk){
  const p=penalties[mk]||[];let total=0,list=[];
  p.filter(x=>x.empId===empId).forEach(x=>{list.push(x);total+=Number(x.amount)});
  return{list,total}
}
function getAttData(empId,mk){return attendance[mk]?.[empId]||{onTime:0,late:0,total:0,lateHours:0,lateMinutes:0}}
function getMonthTarget(){const q=monthToQuarter(state.month),qt=quarterlyTargets[q]||{};return(qt.months&&qt.months[state.month]!==undefined)?qt.months[state.month]:qt.target||0}
function currentUserCanUpload(){if(state.user.role==='owner')return true;const empId=state.user.empId;if(!empId)return false;const emp=empRecord(empId);return emp?!!emp.canUploadPhoto:false}
function getTotalUnread(){if(state.user&&state.user.empId)return empMessages(state.user.empId).filter(m=>!m.read).length;return 0}

function getKPI(empId,mk){
  const w=kpiWeights,md=getMonthData(mk);
  const empHours=md.hours[empId]||0,totalHours=Object.values(md.hours||{}).reduce((s,h)=>s+h,0)||1;
  const hoursScore=Math.min(100,(empHours/totalHours)*employees.length*100);
  const att=getAttData(empId,mk);
  const attScore=att.total>0?(att.onTime/att.total*100):75;
  const punctScore=att.total>0?((1-(att.late/att.total))*100):80;
  const totalLateH=att.lateHours+(att.lateMinutes/60);
  const latenessScore=totalLateH>40?0:totalLateH>30?20:totalLateH>15?70:totalLateH>0?90:100;
  const empSales=(md.empSales||{})[empId]||0,totalES=Object.values(md.empSales||{}).reduce((s,v)=>s+v,0)||1;
  const salesScore=empSales>0?Math.min(100,(empSales/totalES)*employees.length*80):50;
  const mis=(missions[mk]||[]).filter(m=>m.empId===empId&&m.score!==undefined);
  const missionScore=mis.length>0?(mis.reduce((s,m)=>s+m.score,0)/mis.length):70;
  const raw=hoursScore*(w.hours/100)+attScore*(w.attendance/100)+punctScore*(w.punctuality/100)+latenessScore*(w.lateness/100)+salesScore*(w.sales/100)+missionScore*(w.missions/100)+75*(w.satisfaction/100)+80*(w.teamwork/100);
  return Math.min(100,Math.max(0,Math.round(raw)));
}

let state={loggedIn:false,loading:false,loginError:'',user:null,page:'dashboard',sidebarOpen:true,modal:null,year:new Date().getFullYear(),month:new Date().getMonth(),notification:null,myPerfEmpId:null,dismissedNotifs:[],syncStatus:'live'};
let employees,kpiWeights,monthlyData,attendance,missions,messages,bonuses,penalties,quarterlyTargets,shiftSchedule;
let users=[];                          // login accounts — loaded for the owner only
let myView=null,leaderboardView=null;  // what a regular employee is allowed to see
let _pendingImg=null,_realtimeSub=null;
let _synced={},_viewSynced={};

const STORE_KEYS=['employees','kpi_weights','monthly_data','attendance','missions','messages','bonuses','penalties','quarterly_targets','shift_schedule'];
function isStaff(){return!!state.user&&(state.user.role==='owner'||state.user.role==='senior')}
function storeGet(k){return{employees,kpi_weights:kpiWeights,monthly_data:monthlyData,attendance,missions,messages,bonuses,penalties,quarterly_targets:quarterlyTargets,shift_schedule:shiftSchedule}[k]}
function storeSet(k,v){switch(k){case'employees':employees=v;break;case'kpi_weights':kpiWeights=v;break;case'monthly_data':monthlyData=v;break;case'attendance':attendance=v;break;case'missions':missions=v;break;case'messages':messages=v;break;case'bonuses':bonuses=v;break;case'penalties':penalties=v;break;case'quarterly_targets':quarterlyTargets=v;break;case'shift_schedule':shiftSchedule=v;break}}
function resetData(){
  employees=clone(EMPLOYEES_DEFAULT);kpiWeights=clone(KPI_W_DEF);monthlyData={};attendance={};missions={};messages=[];bonuses={};penalties={};
  quarterlyTargets={Q1:{target:2500000,months:{}},Q2:{target:2700000,months:{}},Q3:{target:2800000,months:{}},Q4:{target:3000000,months:{}}};shiftSchedule={};
  users=[];myView=null;leaderboardView=null;_synced={};_viewSynced={};
}
function normalize(){
  if(!Array.isArray(employees))employees=[];
  employees.forEach(e=>{if(e.canUploadPhoto===undefined)e.canUploadPhoto=false});
  if(!Array.isArray(messages))messages=[];
  if(!kpiWeights||typeof kpiWeights!=='object')kpiWeights=clone(KPI_W_DEF);
  const obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};
  monthlyData=obj(monthlyData);attendance=obj(attendance);missions=obj(missions);bonuses=obj(bonuses);penalties=obj(penalties);quarterlyTargets=obj(quarterlyTargets);shiftSchedule=obj(shiftSchedule);
}
function profileToUser(p){return{id:p.id,username:p.username,name:p.name,role:p.role,empId:p.emp_id||null,pages:Array.isArray(p.pages)?p.pages:[]}}

async function loadStaffData(){
  const{data,error}=await sb.from('app_store').select('id,data');
  if(error)throw error;
  data.forEach(r=>{if(STORE_KEYS.includes(r.id)&&r.data!=null){storeSet(r.id,r.data);_synced[r.id]=stableStr(r.data)}});
  normalize();
}
async function loadUsers(){
  if(state.user?.role!=='owner'){users=[];return}
  const{data,error}=await sb.from('profiles').select('id,username,name,role,emp_id,pages').order('created_at');
  if(error)throw error;
  users=data.map(profileToUser);
}
async function loadViewCache(){
  const{data}=await sb.from('emp_view').select('emp_id,data');
  (data||[]).forEach(r=>{_viewSynced[r.emp_id]=stableStr(r.data)});
}
async function loadEmpData(){
  const{data,error}=await sb.from('emp_view').select('emp_id,data').in('emp_id',[state.user.empId||'-','_leaderboard']);
  if(error)throw error;
  myView=null;leaderboardView=null;

// ══════════════════════════════════════════════
//  CLOUD DATA — SAVE (owner / supervisor)
//  Only changed parts are uploaded. Saves run one after another.
// ══════════════════════════════════════════════
let _saveChain=Promise.resolve();
function saveAll(){_saveChain=_saveChain.then(doSave);return _saveChain}
async function doSave(){
  if(!isStaff())return;
  const rows=[];
  STORE_KEYS.forEach(k=>{const s=stableStr(storeGet(k));if(s!==_synced[k])rows.push({id:k,s})});
  try{
    if(rows.length){
      const now=new Date().toISOString();
      const{error}=await sb.from('app_store').upsert(rows.map(r=>({id:r.id,data:JSON.parse(r.s),updated_at:now})));
      if(error)throw error;
      rows.forEach(r=>{_synced[r.id]=r.s});
    }
    await publishEmpViews();
    setSync('live');
  }catch(e){console.error('Save failed',e);setSync('error');showToast('تعذّر الحفظ في السحابة — تحقق من الإنترنت وأعد المحاولة','error')}
}
function setSync(s){if(state.syncStatus===s)return;state.syncStatus=s;const el=document.getElementById('sync-status');if(el)el.outerHTML=syncStatusHTML()}

// Each employee gets a personal snapshot with ONLY their own numbers,
// plus a shared leaderboard (names + KPI). This is what employees can read.
function allMonthKeys(){
  const ks=new Set();
  [monthlyData,attendance,missions,bonuses,penalties].forEach(o=>Object.keys(o||{}).forEach(k=>ks.add(k)));
  [new Date().getFullYear(),state.year].forEach(y=>{for(let m=0;m<12;m++)ks.add(`${y}-${m}`)});
  return[...ks];
}
function empMonthStats(emp,mk){
  const md=getMonthData(mk),commData=calcCommission(md.sales||0),hrs=(md.hours||{})[emp.id]||0,sal=calcSalary(emp,hrs);
  const comm=emp.commPct>0?commData.pool*(emp.commPct/100):0,{total:bt}=getEmpBonuses(emp.id,mk),{total:pt}=getEmpPenalties(emp.id,mk);
  return{hrs,sal,comm,bt,pt,net:sal+comm+bt-pt,kpi:getKPI(emp.id,mk),att:getAttData(emp.id,mk),empSales:(md.empSales||{})[emp.id]||0};
}
function buildEmpView(empId){
  const e=employees.find(x=>x.id===empId);
  const months={};allMonthKeys().forEach(mk=>{months[mk]=empMonthStats(e,mk)});
  const ms={};Object.entries(missions||{}).forEach(([mk,arr])=>{const mine=(arr||[]).filter(m=>m.empId===empId);if(mine.length)ms[mk]=mine});
  return{emp:{id:e.id,name:e.name,role:e.role,shift:e.shift,commPct:e.commPct,canUploadPhoto:!!e.canUploadPhoto,fixedBonus:e.fixedBonus||0},months,missions:ms,messages:messages.filter(m=>m.to===empId)};
}
function buildLeaderboard(){const out={};allMonthKeys().forEach(mk=>{out[mk]=employees.map(e=>({id:e.id,name:e.name,role:e.role,kpi:getKPI(e.id,mk)}))});return out}
async function publishEmpViews(){
  const rows=[];
  const add=(id,obj)=>{const s=stableStr(obj);if(s!==_viewSynced[id])rows.push({id,s})};
  employees.forEach(e=>add(e.id,buildEmpView(e.id)));
  add('_leaderboard',buildLeaderboard());
  if(!rows.length)return;
  const now=new Date().toISOString();
  const{error}=await sb.from('emp_view').upsert(rows.map(r=>({emp_id:r.id,data:JSON.parse(r.s),updated_at:now})));
  if(error)throw error;
  rows.forEach(r=>{_viewSynced[r.id]=r.s});
}

// Same questions, answered from full data (staff) or from the personal snapshot (employee).
function empRecord(empId){if(isStaff())return employees.find(e=>e.id===empId);return myView?.emp?.id===empId?myView.emp:null}
function empStats(empId,mk){
  if(isStaff()){const e=employees.find(x=>x.id===empId);return e?empMonthStats(e,mk):null}
  const s=myView?.months?.[mk];if(s)return s;
  const fb=myView?.emp?.fixedBonus||0;
  return{hrs:0,sal:0,comm:0,bt:fb,pt:0,net:fb,kpi:0,att:{onTime:0,late:0,total:0,lateHours:0,lateMinutes:0},empSales:0};
}
function empMissions(empId,mk){return isStaff()?(missions[mk]||[]).filter(m=>m.empId===empId):((myView?.missions||{})[mk]||[])}
function empMessages(empId){return isStaff()?messages.filter(m=>m.to===empId):(myView?.messages||[])}
function rankedFor(mk){
  const list=isStaff()?employees.map(e=>({id:e.id,name:e.name,role:e.role,kpi:getKPI(e.id,mk)})):[...((leaderboardView||{})[mk]||[])];
  return list.sort((a,b)=>b.kpi-a.kpi);
}

//  LIVE UPDATES
// ══════════════════════════════════════════════
const EDIT_PAGES=['monthly','attendance','kpi','settings','shifts','employees'];
function subscribeRealtime(){
  if(_realtimeSub){sb.removeChannel(_realtimeSub);_realtimeSub=null}
  const table=isStaff()?'app_store':'emp_view';
  _realtimeSub=sb.channel('ek_'+table).on('postgres_changes',{event:'*',schema:'public',table},p=>onRemoteChange(table,p)).subscribe();
}
async function onRemoteChange(table,p){
  try{
    if(table==='app_store'){
      const id=p.new?.id||p.old?.id;if(!STORE_KEYS.includes(id))return;
      let data=p.new?.data;
      if(data===undefined){const r=await sb.from('app_store').select('data').eq('id',id).maybeSingle();data=r.data?.data}
      if(data==null)return;
      const s=stableStr(data);if(s===_synced[id])return; // our own save coming back
      storeSet(id,data);_synced[id]=s;normalize();
    }else{
      await loadEmpData();
    }
    // Don't wipe what someone is typing: data is updated now, screen refreshes on next navigation.
    if(state.modal||(isStaff()&&EDIT_PAGES.includes(state.page)))return;
    render();
  }catch(e){console.warn('Realtime update error',e)}
}

async function afterLogin(session){
  const{data:p,error}=await sb.from('profiles').select('id,username,name,role,emp_id,pages').eq('id',session.user.id).maybeSingle();
  if(error)throw error;
  if(!p){await sb.auth.signOut();throw new Error('no_profile')}
  state.user=profileToUser(p);
  resetData();
  if(isStaff()){
    await loadStaffData();await loadUsers();await loadViewCache();
    saveAll(); // seeds first-time data and refreshes employee snapshots
  }else{
    await loadEmpData();
  }
  state.dismissedNotifs=ls('dismissed_notifs')||[];
  state.page=state.user.role==='employee'?(state.user.pages[0]||'myperformance'):(state.user.pages[0]||'myperformance');
  state.loggedIn=true;
  subscribeRealtime();
}
async function doLogout(){
  if(_realtimeSub){sb.removeChannel(_realtimeSub);_realtimeSub=null}
  try{await _saveChain}catch{}
  await sb.auth.signOut();
  logoutLocal();
}
function logoutLocal(){document.querySelectorAll('.toast').forEach(t=>t.remove());state.loggedIn=false;state.user=null;state.myPerfEmpId=null;state.modal=null;resetData();render()}

function showToast(msg,type='success'){
  const el=document.createElement('div');
  el.className=`toast toast-${type}`;
  el.innerHTML=`<span>${type==='success'?'✅':type==='error'?'❌':'ℹ️'}</span><span>${msg}</span>`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2800);
}

function buildOwnerNotifs(){
  const mk=monthKey(),notifs=[];
  const pending=(missions[mk]||[]).filter(m=>m.completed&&m.score===undefined);
  if(pending.length>0){const id='owner_pending_'+mk;if(!state.dismissedNotifs.includes(id))notifs.push({id,type:'owner',icon:'🎯',msg:`${pending.length} مهمة مكتملة تنتظر التقييم`})}
  const md=getMonthData();if((md.sales||0)>0&&(md.sales||0)<662400){const id='owner_sales_'+mk;if(!state.dismissedNotifs.includes(id))notifs.push({id,type:'owner',icon:'⚠️',msg:`المبيعات أقل من حد العمولة — تحتاج ${fmtNum(662400-(md.sales||0))} ج.م إضافية`})}
  return notifs;
}
function buildSeniorNotifs(){
  const mk=monthKey(),notifs=[];
  const myEmpId=state.user.empId;
  const assignedEmps=myEmpId?(SENIOR_ASSIGNS[myEmpId]||[]):[];
  const pending=(missions[mk]||[]).filter(m=>assignedEmps.includes(m.empId)&&m.completed&&m.score===undefined);
  if(pending.length>0){const id='senior_pending_'+mk+'_'+myEmpId;if(!state.dismissedNotifs.includes(id))notifs.push({id,type:'owner',icon:'🎯',msg:`${pending.length} مهمة مكتملة تنتظر التقييم`})}
  return notifs;
}
function buildEmpNotifs(empId){
  const mk=monthKey(),notifs=[];
  const ranked=rankedFor(mk).map(r=>({e:r,kpi:r.kpi}));
  const top=ranked[0],myKpi=(ranked.find(r=>r.e.id===empId)||{kpi:empStats(empId,mk)?.kpi||0}).kpi;
  if(top){const id=`top_${mk}_${top.e.id}`;if(!state.dismissedNotifs.includes(id)){if(top.e.id===empId)notifs.push({id,type:'gold',icon:'🏆',msg:`أنت المتصدر هذا الشهر بدرجة KPI ${top.kpi}%`});else notifs.push({id,type:'success',icon:'🏆',msg:`المتصدر هذا الشهر: ${top.e.name} بـ ${top.kpi}%`})}}
  if(myKpi<60){const id=`improve_${mk}_${empId}`;if(!state.dismissedNotifs.includes(id))notifs.push({id,type:'warn',icon:'📉',msg:`درجة KPI الخاصة بك ${myKpi}% — يحتاج تحسين`})}
  const newlyRated=empMissions(empId,mk).filter(m=>m.score!==undefined&&!m.seenByEmployee);
  if(newlyRated.length>0){const id=`rated_${mk}_${empId}`;if(!state.dismissedNotifs.includes(id))notifs.push({id,type:'gold',icon:'⭐',msg:`لديك ${newlyRated.length} مهمة تم تقييمها`})}
  return notifs;
}

  groups.push({group:'حسابي',items:[{id:'myperformance',icon:'🪪',label:'أدائي الشهري'},{id:'mypassword',icon:'🔑',label:'كلمة المرور'}]});

function render(){
  const app=document.getElementById('app');
  if(state.loading){app.innerHTML=`<div class="login-wrap"><div style="text-align:center;color:var(--text2)"><img src="${LOGO_B64}" style="max-width:160px;max-height:60px;object-fit:contain;margin-bottom:14px"><div style="font-size:14px">⏳ جاري تحميل البيانات…</div></div></div>`;return}
  if(!state.loggedIn){app.innerHTML=renderLogin();bindLogin();return}
  const role=state.user.role;
  let notifBarsHTML='';
  if(role==='owner')buildOwnerNotifs().forEach(n=>{notifBarsHTML+=notifBarHTML(n)});

function bindLogin(){
  const doLogin=async()=>{
    const u=document.getElementById('login-user').value.trim();
    const p=document.getElementById('login-pass').value;
    const errEl=document.getElementById('login-err'),btn=document.getElementById('login-btn');
    if(!u||!p){errEl.textContent='أدخل اسم المستخدم وكلمة المرور';return}
    errEl.textContent='';btn.disabled=true;btn.textContent='⏳ جاري الدخول…';
    const{data,error}=await sb.auth.signInWithPassword({email:loginEmail(u),password:p});
    if(error){
      btn.disabled=false;btn.textContent='دخول';
      errEl.textContent=/invalid/i.test(error.message)?'اسم المستخدم أو كلمة المرور غير صحيحة':'تعذّر الاتصال: '+error.message;
      return;
    }
    state.loading=true;state.loginError='';render();
    try{await afterLogin(data.session)}
    catch(e){
      console.error(e);
      state.loginError=e.message==='no_profile'?'هذا الحساب غير مفعّل — تواصل مع المالك':'تعذّر تحميل البيانات: '+errMsg(e);
      await sb.auth.signOut().catch(()=>{});
    }
    state.loading=false;render();
  };
  document.getElementById('login-btn').onclick=doLogin;
  document.getElementById('login-pass').onkeydown=e=>{if(e.key==='Enter')doLogin()};
  document.getElementById('login-user').onkeydown=e=>{if(e.key==='Enter')document.getElementById('login-pass').focus()};
  document.getElementById('toggle-pass').onclick=()=>{const inp=document.getElementById('login-pass');inp.type=inp.type==='password'?'text':'password'};
}

function renderLeaderboard(){
  const mk=monthKey(),md=getMonthData(),commData=calcCommission(md.sales||0),isOwner=state.user.role==='owner';
  const ranked=isStaff()
    ?[...employees].map(e=>{const hrs=md.hours[e.id]||0,sal=calcSalary(e,hrs),comm=e.commPct>0?commData.pool*(e.commPct/100):0;return{e,sal,comm,kpiScore:getKPI(e.id,mk)}}).sort((a,b)=>b.kpiScore-a.kpiScore)
    :rankedFor(mk).map(r=>({e:r,sal:0,comm:0,kpiScore:r.kpi}));
  if(!ranked.length)return`<div class="card" style="text-align:center;color:var(--text3);padding:40px">لا توجد بيانات لهذا الشهر بعد</div>`;
  const top3=ranked.slice(0,3);
  const rest=ranked.slice(3);
  return`<div class="section-header"><h3>🏆 المتصدرون — ${MONTHS_AR[state.month]} ${state.year}</h3><span class="badge badge-gray">${ranked.length} موظف</span></div>
  <div class="grid-3" style="margin-bottom:20px">${top3.map((r,i)=>`<div class="podium-card rank-${i+1}"><div style="font-size:${i===0?'36px':'28px'};margin-bottom:6px">${['🥇','🥈','🥉'][i]}</div><div style="font-weight:800;font-size:15px">${r.e.name}</div><div style="font-size:11px;color:var(--text2);margin-top:2px">${r.e.role}</div><div style="font-size:36px;font-weight:800;color:${kpiColor(r.kpiScore)};margin:12px 0">${r.kpiScore}</div><div class="kpi-bar" style="margin-bottom:8px"><div class="kpi-fill" style="width:${r.kpiScore}%;background:${kpiColor(r.kpiScore)}"></div></div><span class="badge" style="background:${kpiColor(r.kpiScore)}22;color:${kpiColor(r.kpiScore)}">${kpiLabel(r.kpiScore)}</span>${isOwner?`<div style="margin-top:10px;font-size:13px;font-weight:700;color:var(--gold2)">${fmtNum(r.sal+r.comm)} ج.م</div>`:''}${i===0?`<div style="position:absolute;top:-8px;right:-8px;font-size:22px">👑</div>`:''}</div>`).join('')}
  </div>
  <div class="card">${rest.map((r,i)=>`<div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)"><div style="width:28px;text-align:center;font-weight:800;color:var(--text3);font-size:16px">${i+4}</div><div style="flex:1"><div style="font-weight:700">${r.e.name}</div><div style="font-size:11px;color:var(--text2)">${r.e.role}</div><div class="kpi-bar" style="margin-top:5px"><div class="kpi-fill" style="width:${r.kpiScore}%;background:${kpiColor(r.kpiScore)}"></div></div></div><div style="text-align:center;min-width:52px"><div style="font-weight:800;color:${kpiColor(r.kpiScore)};font-size:18px">${r.kpiScore}</div></div>${isOwner?`<div style="min-width:90px;text-align:center"><div style="font-size:12px;font-weight:700;color:var(--gold2)">${fmtNum(r.sal+r.comm)} ج.م</div></div>`:''}</div>`).join('')}</div>`;
}

function renderInsights(){
  const md=getMonthData(),mk=monthKey(),commData=calcCommission(md.sales||0);
  const totalSal=employees.reduce((s,e)=>s+calcSalary(e,md.hours[e.id]||0),0);
  const insights=[];
  if((md.sales||0)<662400)insights.push({t:'warn',icon:'⚠️',title:'المبيعات أقل من حد العمولة',body:`تحتاج ${fmtNum(662400-(md.sales||0))} ج.م إضافية لبدء العمولة`});
  else insights.push({t:'success',icon:'✅',title:'تم تحقيق حد العمولة',body:`${fmtNum(md.sales)} ج.م — ${commData.rate}% — مجمع ${fmtNum(commData.pool,2)} ج.م`});
  if(md.np&&totalSal>0){const r=totalSal/md.np*100;if(r>35)insights.push({t:'warn',icon:'💸',title:`تكلفة العمالة مرتفعة — ${r.toFixed(1)}%`,body:'تكلفة العمالة تتجاوز 35% من صافي الربح'});else insights.push({t:'success',icon:'💰',title:`تكلفة العمالة معقولة — ${r.toFixed(1)}%`,body:'نسبة صحية من صافي الربح'})}
  const target=getMonthTarget();if(target>0&&(md.sales||0)>0){const pct=((md.sales||0)/target*100);insights.push({t:pct>=100?'success':'warn',icon:pct>=100?'🎯':'📊',title:`تحقيق الهدف: ${pct.toFixed(1)}%`,body:`${fmtNum(md.sales||0)} من أصل ${fmtNum(target)} ج.م`})}
  const top=[...employees].sort((a,b)=>getKPI(b.id,mk)-getKPI(a.id,mk))[0];
  if(top)insights.push({t:'info',icon:'🏆',title:`أفضل أداء — ${top.name}`,body:`KPI: ${getKPI(top.id,mk)} — ${kpiLabel(getKPI(top.id,mk))}`});
  const low=employees.filter(e=>getKPI(e.id,mk)<60);if(low.length)insights.push({t:'warn',icon:'📉',title:`${low.length} موظف يحتاج تحسين في الأداء`,body:low.map(e=>e.name).join('، ')});
  const highLate=employees.filter(e=>{const a=getAttData(e.id,mk);return(a.lateHours+(a.lateMinutes/60))>30});if(highLate.length)insights.push({t:'warn',icon:'⏰',title:`${highLate.length} موظف تأخيرهم يتجاوز 30 ساعة`,body:highLate.map(e=>e.name).join('، ')});
  const pending=(missions[mk]||[]).filter(m=>m.completed&&m.score===undefined);if(pending.length)insights.push({t:'warn',icon:'🎯',title:`${pending.length} مهمة تنتظر التقييم`,body:'يرجى مراجعة المهام المكتملة وتقييمها'});
  return`<div style="display:flex;flex-direction:column;gap:12px">${insights.map(ins=>`<div class="card" style="border-right:4px solid ${ins.t==='success'?'var(--success)':ins.t==='warn'?'var(--warn)':'var(--accent)'}"><div style="display:flex;gap:14px;align-items:center"><div style="font-size:28px">${ins.icon}</div><div><div style="font-weight:800;font-size:14px;margin-bottom:3px">${ins.title}</div><div style="font-size:13px;color:var(--text2)">${ins.body}</div></div></div></div>`).join('')}</div>`;
}

    content=`<div class="modal-header"><h3>🎯 إضافة مهمة جديدة</h3><button class="modal-close" id="modal-cancel">✕</button></div><div class="form-group"><label>الموظف</label><select id="modal-emp">${ca.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')}</select></div><div class="form-row"><div class="form-group"><label>عنوان المهمة</label><input id="modal-title" type="text"></div><div class="form-group"><label>الأسبوع</label><select id="modal-week">${[1,2,3,4].map(w=>`<option value="${w}">الأسبوع ${w}</option>`).join('')}</select></div></div><div class="form-group"><label>التفاصيل</label><textarea id="modal-desc" rows="3"></textarea></div><div class="form-group"><label>صورة المهمة (اختياري — حتى 15MB)</label><div class="img-upload-area" id="img-drop-area" onclick="document.getElementById('mission-img-input').click()"><div id="img-preview-wrap"><div style="font-size:32px;margin-bottom:6px">📷</div><div style="font-size:13px">اضغط أو اسحب صورة هنا</div></div></div><input type="file" id="mission-img-input" accept="image/*" capture="environment" style="display:none"></div><div class="modal-footer"><button class="btn btn-ghost" id="modal-cancel-2">إلغاء</button><button class="btn btn-primary" id="modal-save">💾 حفظ</button></div>`;
  } else if(m.type==='score-mission'){
    content=`<div class="modal-header"><h3>⭐ تقييم المهمة</h3><button class="modal-close" id="modal-cancel">✕</button></div>

      <div class="form-group"><label>الدرجة (0 – 100)</label><input id="modal-score" type="number" min="0" max="100" value="80"></div>
      <div class="modal-footer"><button class="btn btn-ghost" id="modal-cancel-2">إلغاء</button><button class="btn btn-primary" id="modal-save">💾 حفظ التقييم</button></div>`;
  } else if(m.type==='emp-upload-photo'){
    _pendingImg=null;
    content=`<div class="modal-header"><h3>📷 رفع صورة للمهمة</h3><button class="modal-close" id="modal-cancel">✕</button></div>
      <p style="color:var(--text2);font-size:13px;margin-bottom:14px">${esc(m.mission.title)}</p>
      <div class="form-group"><div class="img-upload-area" id="emp-img-drop-area" onclick="document.getElementById('emp-mission-img-input').click()"><div id="emp-img-preview-wrap">${safeImg(m.mission.employeeImageData)?`<img src="${safeImg(m.mission.employeeImageData)}" style="width:100%;max-height:180px;object-fit:cover;border-radius:8px"><div style="font-size:11px;color:var(--success);margin-top:6px">✅ اضغط لتغيير</div>`:`<div style="font-size:32px;margin-bottom:6px">📷</div><div>اضغط أو اسحب صورة</div><div style="font-size:11px;color:var(--text3);margin-top:4px">يدعم التصوير المباشر من الكاميرا</div>`}</div></div><input type="file" id="emp-mission-img-input" accept="image/*" capture="environment" style="display:none"></div>
      <div class="modal-footer"><button class="btn btn-ghost" id="modal-cancel-2">إلغاء</button><button class="btn btn-primary" id="modal-save-emp-photo" data-mission-id="${esc(m.mission.id)}">💾 حفظ الصورة</button></div>`;
  } else if(m.type==='send-msg'){
    content=`<div class="modal-header"><h3>✉️ إرسال رسالة</h3><button class="modal-close" id="modal-cancel">✕</button></div><div class="form-group"><label>إلى</label><select id="modal-emp"><option value="all">جميع الموظفين</option>${employees.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')}</select></div><div class="form-group"><label>نوع الرسالة</label><select id="modal-type"><option>إطراء وتحفيز</option><option>تحذير أو توجيه</option><option>معلومات عامة</option><option>هدف أو مهمة</option></select></div><div class="form-group"><label>نص الرسالة</label><textarea id="modal-body" rows="4"></textarea></div><div class="modal-footer"><button class="btn btn-ghost" id="modal-cancel-2">إلغاء</button><button class="btn btn-primary" id="modal-save">إرسال</button></div>`;
  } else if(m.type==='edit-emp'){
    const e=m.emp;
    content=`<div class="modal-header"><h3>✏️ تعديل بيانات الموظف</h3><button class="modal-close" id="modal-cancel">✕</button></div><div class="form-row"><div class="form-group"><label>الاسم</label><input id="emp-name" value="${esc(e.name)}"></div><div class="form-group"><label>الدور</label><input id="emp-role" value="${esc(e.role)}"></div></div><div class="form-row"><div class="form-group"><label>سعر الساعة (ج.م)</label><input type="number" id="emp-hourrate" value="${e.hourRate}"></div><div class="form-group"><label>العمولة %</label><input type="number" id="emp-commpct" value="${e.commPct}" step="0.5"></div></div><div class="form-row"><div class="form-group"><label>الوردية</label><input id="emp-shift" value="${esc(e.shift)}"></div><div class="form-group"><label>وقت الحضور المقرر</label><input type="time" id="emp-schedtime" value="${esc(e.scheduledTime)}"></div></div><div class="form-row"><div class="form-group"><label>مكافأة ثابتة (ج.م)</label><input type="number" id="emp-fixedbonus" value="${e.fixedBonus||0}"></div><div class="form-group"><label>اسم المكافأة</label><input id="emp-bonusname" value="${esc(e.bonusName||'')}"></div></div><div class="modal-footer"><button class="btn btn-ghost" id="modal-cancel-2">إلغاء</button><button class="btn btn-primary" id="modal-save-emp" data-id="${e.id}">💾 حفظ</button></div>`;
  } else if(m.type==='edit-user'||m.type==='add-user'){
    const isNew=m.type==='add-user',u=isNew?(m.user||{username:'',name:'',role:'employee',empId:''}):m.user,self=!isNew&&u.id===state.user.id;
    content=`<div class="modal-header"><h3>${isNew?'➕ مستخدم جديد':'✏️ تعديل المستخدم'}</h3><button class="modal-close" id="modal-cancel">✕</button></div>
      <div class="form-row"><div class="form-group"><label>الاسم المعروض</label><input id="user-display-name" value="${esc(u.name)}"></div><div class="form-group"><label>اسم المستخدم (إنجليزي)</label><input id="user-username" dir="ltr" value="${esc(u.username)}" placeholder="ahmed"></div></div>
      <div class="form-row"><div class="form-group"><label>الدور</label><select id="user-role" ${self?'disabled':''}>${[['employee','موظف'],['senior','مشرف'],['owner','مالك']].map(([v,l])=>`<option value="${v}"${u.role===v?' selected':''}>${l}</option>`).join('')}</select></div>
      <div class="form-group"><label>الموظف المرتبط</label><select id="user-emp"><option value="">— لا يوجد —</option>${employees.map(e=>`<option value="${esc(e.id)}"${u.empId===e.id?' selected':''}>${esc(e.name)}</option>`).join('')}</select></div></div>
      <hr style="border-color:var(--border);margin:12px 0">
      <p style="color:var(--text2);font-size:12px;margin-bottom:10px">${isNew?'كلمة مرور مؤقتة — أعطها للموظف ويمكنه تغييرها من صفحة «كلمة المرور»':'اترك كلمة المرور فارغة لعدم التغيير'}</p>
      <div class="form-row"><div class="form-group"><label>${isNew?'كلمة المرور':'كلمة مرور جديدة'}</label><input type="text" id="user-newpass" dir="ltr" value="${isNew?genPassword():''}" autocomplete="off"></div><div class="form-group" style="display:flex;align-items:flex-end"><button class="btn btn-ghost btn-sm" id="gen-pass-btn" type="button">🎲 توليد كلمة مرور</button></div></div>
      <p id="user-edit-err" style="color:var(--danger);font-size:12px;margin-bottom:8px"></p>
      <div class="modal-footer"><button class="btn btn-ghost" id="modal-cancel-2">إلغاء</button><button class="btn btn-primary" id="modal-save-user">💾 ${isNew?'إنشاء الحساب':'حفظ'}</button></div>`;
  } else if(m.type==='credentials'){
    content=`<div class="modal-header"><h3>🔐 بيانات الدخول</h3><button class="modal-close" id="modal-cancel">✕</button></div>
      <div style="background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.25);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--gold2)">⚠️ انسخ أو اطبع هذه القائمة الآن — لن تظهر كلمات المرور مرة أخرى. أعطِ كل موظف بياناته فقط.</div>
      <div class="table-wrap" id="creds-table"><table><thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>كلمة المرور</th></tr></thead><tbody>${m.list.map(c=>`<tr><td style="font-weight:700">${esc(c.name)}</td><td dir="ltr" style="font-family:monospace">${esc(c.username)}</td><td dir="ltr" style="font-family:monospace;color:var(--gold2)">${c.error?`<span style="color:var(--danger)">${esc(c.error)}</span>`:esc(c.password)}</td></tr>`).join('')}</tbody></table></div>
      <p style="color:var(--text2);font-size:12px;margin-top:10px">رابط الدخول: <span dir="ltr" style="font-family:monospace">${esc(location.origin+location.pathname)}</span></p>
      <div class="modal-footer"><button class="btn btn-ghost" id="copy-creds-btn">📋 نسخ</button><button class="btn btn-ghost" id="print-creds-btn">🖨️ طباعة</button><button class="btn btn-primary" id="modal-cancel-2">تم</button></div>`;
  } else if(m.type==='edit-perms'){
    const u=m.user,uPages=u.pages||[];
    const available=u.role==='employee'?ALL_EMP_PAGES:(u.role==='owner'?ALL_PAGES:ALL_PAGES.filter(p=>!p.ownerOnly));
    content=`<div class="modal-header"><h3>🛡️ صلاحيات — ${esc(u.name)}</h3><button class="modal-close" id="modal-cancel">✕</button></div>
      <div style="background:var(--bg3);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--text2)">اختر الصفحات التي يمكن لهذا المستخدم الوصول إليها</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">${available.map(p=>{const on=uPages.includes(p.id);return`<label class="perm-item${on?' on':''}" style="cursor:pointer"><input type="checkbox" class="perm-cb" data-page="${p.id}" ${on?'checked':''} style="width:auto;margin:0"><span>${p.icon}</span><span style="font-size:12px">${p.label}</span></label>`}).join('')}</div>
      <div class="modal-footer" style="justify-content:space-between"><div style="display:flex;gap:6px"><button class="btn btn-ghost btn-sm" id="perm-all">الكل</button><button class="btn btn-ghost btn-sm" id="perm-none">لا شيء</button></div><div style="display:flex;gap:6px"><button class="btn btn-ghost" id="modal-cancel-2">إلغاء</button><button class="btn btn-primary" id="modal-save-perms">💾 حفظ</button></div></div>`;
  }
  return`<div class="modal-overlay" id="modal-overlay"><div class="modal">${content}</div></div>`;
}

// ══════════════════════════════════════════════
//  EVENT BINDING
// ══════════════════════════════════════════════
function bindEvents(){
  // Nav
  document.querySelectorAll('.nav-item[data-page]').forEach(el=>{el.onclick=()=>{state.page=el.dataset.page;render()}});
  document.getElementById('logout-btn')?.addEventListener('click',doLogout);
  document.getElementById('hamburger-btn')?.addEventListener('click',()=>{
    const sb2=document.getElementById('sidebar');
    if(window.innerWidth<=640){sb2.classList.toggle('open')}else{state.sidebarOpen=!state.sidebarOpen;render()}
  });
  document.getElementById('year-sel')?.addEventListener('change',e=>{state.year=+e.target.value;render()});
  document.getElementById('month-sel')?.addEventListener('change',e=>{state.month=+e.target.value;render()});
  document.querySelectorAll('.notif-close[data-dismiss]').forEach(btn=>{btn.onclick=()=>{state.dismissedNotifs.push(btn.dataset.dismiss);lss('dismissed_notifs',state.dismissedNotifs);render()}});
  document.getElementById('my-perf-emp-sel')?.addEventListener('change',e=>{state.myPerfEmpId=e.target.value;render()});

  // Monthly
  document.getElementById('save-monthly-btn')?.addEventListener('click',()=>{
    if(!monthlyData[monthKey()])monthlyData[monthKey()]={sales:0,gp:0,np:0,hours:{},empSales:{}};
    monthlyData[monthKey()].sales=+document.getElementById('inp-sales').value||0;
    monthlyData[monthKey()].gp=+document.getElementById('inp-gp').value||0;
    monthlyData[monthKey()].np=+document.getElementById('inp-np').value||0;
    saveAll();showToast('تم حفظ بيانات الفرع ✓');
  });
  document.getElementById('save-hours-btn')?.addEventListener('click',()=>{
    if(!monthlyData[monthKey()])monthlyData[monthKey()]={sales:0,gp:0,np:0,hours:{},empSales:{}};
    document.querySelectorAll('.hours-inp').forEach(inp=>{monthlyData[monthKey()].hours[inp.dataset.id]=+inp.value||0});
    saveAll();showToast('تم حفظ الساعات ✓');
  });
  document.getElementById('save-emp-sales-btn')?.addEventListener('click',()=>{
    if(!monthlyData[monthKey()])monthlyData[monthKey()]={sales:0,gp:0,np:0,hours:{},empSales:{}};
    if(!monthlyData[monthKey()].empSales)monthlyData[monthKey()].empSales={};
    document.querySelectorAll('.emp-sales-inp').forEach(inp=>{monthlyData[monthKey()].empSales[inp.dataset.id]=+inp.value||0});
    saveAll();showToast('تم حفظ مبيعات الموظفين ✓');render();
  });

  // Payroll export/print
  document.getElementById('print-payroll-btn')?.addEventListener('click',()=>window.print());
  document.getElementById('export-payroll-btn')?.addEventListener('click',()=>{
    const md=getMonthData(),commData=calcCommission(md.sales||0),mk=monthKey();
    let csv='الموظف,الدور,الساعات,الراتب,العمولة,المكافآت,الجزاءات,الصافي\n';
    employees.forEach(e=>{const hrs=md.hours[e.id]||0,sal=calcSalary(e,hrs),comm=e.commPct>0?commData.pool*(e.commPct/100):0,{total:bt}=getEmpBonuses(e.id,mk),{total:pt}=getEmpPenalties(e.id,mk),net=sal+comm+bt-pt;csv+=`${e.name},${e.role},${hrs},${sal.toFixed(2)},${comm.toFixed(2)},${bt},${pt},${net.toFixed(2)}\n`});
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download=`payroll_${monthKey()}.csv`;a.click();
    showToast('تم التصدير ✓');
  });

  // Attendance
  document.getElementById('save-att-btn')?.addEventListener('click',()=>{
    if(!attendance[monthKey()])attendance[monthKey()]={};
    document.querySelectorAll('.att-total[data-id]').forEach(inp=>{
      const id=inp.dataset.id,onTime=+(document.querySelector(`.att-ontime[data-id="${id}"]`)?.value||0),late=+(document.querySelector(`.att-late[data-id="${id}"]`)?.value||0),total=+inp.value,lateHours=+(document.querySelector(`.att-late-hours[data-id="${id}"]`)?.value||0),lateMinutes=+(document.querySelector(`.att-late-minutes[data-id="${id}"]`)?.value||0);
      attendance[monthKey()][id]={onTime,late,total,lateHours,lateMinutes};
    });
    saveAll();showToast('تم حفظ الحضور ✓');render();
  });
  document.getElementById('save-sched-times-btn')?.addEventListener('click',()=>{
    document.querySelectorAll('.sched-time-inp').forEach(inp=>{const emp=employees.find(e=>e.id===inp.dataset.id);if(emp)emp.scheduledTime=inp.value});
    saveAll();showToast('تم حفظ أوقات الحضور ✓');
  });

  // Employees
  document.getElementById('add-emp-btn')?.addEventListener('click',()=>{
    const maxNum=employees.reduce((mx,e)=>{const n=parseInt(e.id.replace('EK',''))||0;return Math.max(mx,n)},0);
    const newId='EK'+String(maxNum+1).padStart(3,'0');
    employees.push({id:newId,name:'موظف جديد',role:'مساعد',hourRate:350,commPct:5,shift:'صباحي',scheduledTime:'09:00',canUploadPhoto:false});
    saveAll();showToast('تم إضافة الموظف ✓ — عدّل بياناته ثم أنشئ له حساب دخول من الإعدادات');render();
  });
  document.querySelectorAll('[data-edit-emp]').forEach(btn=>{btn.onclick=()=>{state.modal={type:'edit-emp',emp:employees.find(e=>e.id===btn.dataset.editEmp)};render()}});

  // Missions
  document.getElementById('add-mission-btn')?.addEventListener('click',()=>{
    state.modal={type:'add-mission'};render();
    setTimeout(()=>bindImgInput('mission-img-input','img-preview-wrap','owner'),50);
  });
  document.querySelectorAll('[data-score-mission]').forEach(btn=>{btn.onclick=()=>{const mk=monthKey(),mission=(missions[mk]||[]).find(m=>m.id===btn.dataset.scoreMission);state.modal={type:'score-mission',mission};render()}});
  document.querySelectorAll('[data-del-mission]').forEach(btn=>{btn.onclick=()=>{const mk=monthKey();missions[mk]=(missions[mk]||[]).filter(m=>m.id!==btn.dataset.delMission);saveAll();render()}});
  document.querySelectorAll('[data-complete-mission]').forEach(btn=>{btn.onclick=async()=>{
    const mk=monthKey(),id=btn.dataset.completeMission,m=empMissions(state.user.empId,mk).find(x=>x.id===id);if(!m)return;
    if(isStaff()){m.completed=true;saveAll()}
    else{btn.disabled=true;const{error}=await sb.rpc('emp_mission_action',{p_mk:mk,p_id:id,p_action:'complete'});if(error){btn.disabled=false;showToast(errMsg(error),'error');return}m.completed=true}
    render();showToast('تم تأكيد إتمام المهمة ✓');
  }});
  document.querySelectorAll('[data-emp-upload-photo]').forEach(btn=>{
    btn.onclick=()=>{
      const mk=monthKey(),missionId=btn.dataset.empUploadPhoto,mission=empMissions(state.user.empId,mk).find(m=>m.id===missionId);
      if(!mission)return;state.modal={type:'emp-upload-photo',mission};render();
      setTimeout(()=>bindImgInput('emp-mission-img-input','emp-img-preview-wrap','employee'),50);
    };
  });

  // Bonuses/Penalties
  document.getElementById('add-bonus-btn')?.addEventListener('click',()=>{state.modal={type:'add-bonus'};render()});
  document.getElementById('add-penalty-btn')?.addEventListener('click',()=>{state.modal={type:'add-penalty'};render()});
  document.querySelectorAll('[data-del-bonus]').forEach(btn=>{btn.onclick=()=>{const mk=monthKey();bonuses[mk]=(bonuses[mk]||[]).filter((_,i)=>i!==+btn.dataset.delBonus);saveAll();render()}});
  document.querySelectorAll('[data-del-penalty]').forEach(btn=>{btn.onclick=()=>{const mk=monthKey();penalties[mk]=(penalties[mk]||[]).filter((_,i)=>i!==+btn.dataset.delPenalty);saveAll();render()}});

  // KPI
  document.querySelectorAll('.kpi-weight-inp').forEach(inp=>{inp.oninput=()=>{
    kpiWeights[inp.dataset.key]=+inp.value;
    const el=document.getElementById(`kw-display-${inp.dataset.key}`);if(el)el.textContent=inp.value+'%';
    const tot=Object.values(kpiWeights).reduce((s,v)=>s+v,0),tel=document.getElementById('kpi-weight-total');
    if(tel){tel.textContent=tot+'%';tel.style.color=tot===100?'var(--success)':'var(--danger)'}
  }});
  document.getElementById('save-kpi-weights')?.addEventListener('click',()=>{saveAll();showToast('تم حفظ أوزان KPI ✓')});

  // Messages
  document.getElementById('send-msg-btn')?.addEventListener('click',()=>{state.modal={type:'send-msg'};render()});
  document.querySelectorAll('[data-del-msg]').forEach(btn=>{btn.onclick=()=>{messages.splice(+btn.dataset.delMsg,1);saveAll();render()}});

  // Shifts
  document.querySelectorAll('[data-emp][data-day]').forEach(cell=>{
    cell.onclick=()=>{
      const empId=cell.dataset.emp,day=+cell.dataset.day;
      const mk=monthKey();if(!shiftSchedule[mk])shiftSchedule[mk]={};if(!shiftSchedule[mk][empId])shiftSchedule[mk][empId]={};
      const types=['صباحي','مسائي','بعد مسائي','توصيل','إجازة','جزئي'];
      const emp=employees.find(e=>e.id===empId);const cur=shiftSchedule[mk][empId][day]||emp?.shift||'صباحي';
      const idx=types.indexOf(cur);shiftSchedule[mk][empId][day]=types[(idx+1)%types.length];
      saveAll();render();
    };
  });
  document.getElementById('save-shifts-btn')?.addEventListener('click',()=>{saveAll();showToast('تم حفظ جدول الورديات ✓')});
  document.getElementById('apply-bulk-shift')?.addEventListener('click',()=>{
    const empVal=document.getElementById('bulk-emp').value,day=+document.getElementById('bulk-day').value,shift=document.getElementById('bulk-shift').value;
    const mk=monthKey();if(!shiftSchedule[mk])shiftSchedule[mk]={};
    const targets=empVal==='all'?employees.map(e=>e.id):[empVal];
    targets.forEach(id=>{if(!shiftSchedule[mk][id])shiftSchedule[mk][id]={};shiftSchedule[mk][id][day]=shift});
    saveAll();showToast('تم تطبيق الوردية ✓');render();
  });

  // Settings
  document.getElementById('change-my-pass-btn')?.addEventListener('click',async()=>{
    const cur=document.getElementById('current-pass').value,nw=document.getElementById('new-pass').value,con=document.getElementById('confirm-pass').value,errEl=document.getElementById('pass-err'),btn=document.getElementById('change-my-pass-btn');
    if(nw.length<6){errEl.textContent='كلمة المرور يجب ألا تقل عن 6 أحرف';return}
    if(nw!==con){errEl.textContent='كلمتا المرور غير متطابقتين';return}
    btn.disabled=true;errEl.textContent='';
    const chk=await sb.auth.signInWithPassword({email:loginEmail(state.user.username),password:cur});
    if(chk.error){btn.disabled=false;errEl.textContent='كلمة المرور الحالية غير صحيحة';return}
    const{error}=await sb.auth.updateUser({password:nw});
    btn.disabled=false;
    if(error){errEl.textContent=errMsg(error);return}
    ['current-pass','new-pass','confirm-pass'].forEach(id=>document.getElementById(id).value='');
    showToast('تم تغيير كلمة المرور ✓');
  });
  document.getElementById('photo-perm-all')?.addEventListener('click',()=>{document.querySelectorAll('.photo-perm-toggle').forEach(cb=>{cb.checked=true})});
  document.getElementById('photo-perm-none')?.addEventListener('click',()=>{document.querySelectorAll('.photo-perm-toggle').forEach(cb=>{cb.checked=false})});
  document.getElementById('save-photo-perms-btn')?.addEventListener('click',()=>{document.querySelectorAll('.photo-perm-toggle').forEach(cb=>{const emp=employees.find(e=>e.id===cb.dataset.id);if(emp)emp.canUploadPhoto=cb.checked});saveAll();showToast('تم حفظ صلاحيات الصور ✓');render()});
  document.querySelectorAll('[data-edit-user]').forEach(btn=>{btn.onclick=()=>{const idx=+btn.dataset.editUser;state.modal={type:'edit-user',user:users[idx],idx};render()}});
  document.getElementById('add-user-btn')?.addEventListener('click',()=>{state.modal={type:'add-user'};render()});
  document.querySelectorAll('[data-del-user]').forEach(btn=>{btn.onclick=async()=>{
    const u=users[+btn.dataset.delUser];if(!u)return;
    if(!confirm(`حذف حساب «${u.name}» (${u.username})؟\nلن يتمكن من الدخول بعد الآن. بيانات الموظف نفسها لن تُحذف.`))return;
    const{error}=await sb.rpc('admin_delete_user',{p_uid:u.id});
    if(error){showToast(errMsg(error),'error');return}
    await loadUsers();render();showToast('تم حذف الحساب ✓');
  }});
  document.getElementById('bulk-create-users-btn')?.addEventListener('click',bulkCreateAccounts);
  document.querySelectorAll('[data-edit-perms]').forEach(btn=>{btn.onclick=()=>{const idx=+btn.dataset.editPerms;state.modal={type:'edit-perms',user:users[idx],idx};render()}});
  document.getElementById('save-qt-btn')?.addEventListener('click',()=>{document.querySelectorAll('.qt-inp').forEach(inp=>{if(!quarterlyTargets[inp.dataset.q])quarterlyTargets[inp.dataset.q]={target:0,months:{}};quarterlyTargets[inp.dataset.q].target=+inp.value});saveAll();showToast('تم حفظ الأهداف الفصلية ✓')});
  document.getElementById('save-month-targets-btn')?.addEventListener('click',()=>{document.querySelectorAll('.month-target-inp').forEach(inp=>{const mi=+inp.dataset.month,q=monthToQuarter(mi);if(!quarterlyTargets[q])quarterlyTargets[q]={target:0,months:{}};if(!quarterlyTargets[q].months)quarterlyTargets[q].months={};const val=inp.value.trim();if(val===''){delete quarterlyTargets[q].months[mi]}else{quarterlyTargets[q].months[mi]=+val}});saveAll();showToast('تم حفظ الأهداف الشهرية ✓')});
  document.getElementById('force-load-btn')?.addEventListener('click',async()=>{
    try{await _saveChain;await loadStaffData();await loadUsers();render();showToast('تم التحديث من السحابة ✓')}catch(e){showToast('فشل التحديث: '+errMsg(e),'error')}
  });

  // Modal overlay close
  document.getElementById('modal-overlay')?.addEventListener('click',e=>{if(e.target.id==='modal-overlay'){state.modal=null;_pendingImg=null;render()}});
  ['modal-cancel','modal-cancel-2'].forEach(id=>{document.getElementById(id)?.addEventListener('click',()=>{state.modal=null;_pendingImg=null;render()})});

  // Modal save handlers
  const mm=state.modal;
  if(mm){
    if(mm.type==='add-bonus'||mm.type==='add-penalty'){
      document.getElementById('modal-save')?.addEventListener('click',()=>{
        const mk=monthKey(),obj={empId:document.getElementById('modal-emp').value,name:document.getElementById('modal-name').value,amount:+document.getElementById('modal-amount').value,visible:document.getElementById('modal-visible').checked};
        if(mm.type==='add-bonus'){if(!bonuses[mk])bonuses[mk]=[];bonuses[mk].push(obj)}else{if(!penalties[mk])penalties[mk]=[];penalties[mk].push(obj)}
        saveAll();state.modal=null;render();showToast('تم الحفظ ✓');
      });
    } else if(mm.type==='add-mission'){
      document.getElementById('modal-save')?.addEventListener('click',()=>{
        const mk=monthKey();if(!missions[mk])missions[mk]=[];
        missions[mk].push({id:Date.now().toString(),empId:document.getElementById('modal-emp').value,title:document.getElementById('modal-title').value,desc:document.getElementById('modal-desc').value,week:+document.getElementById('modal-week').value,assignedBy:state.user.name,completed:false,seenByEmployee:false,imageData:_pendingImg||null,employeeImageData:null});
        _pendingImg=null;saveAll();state.modal=null;render();showToast('تم إضافة المهمة ✓');
      });
    } else if(mm.type==='score-mission'){
      document.getElementById('modal-save')?.addEventListener('click',()=>{
        const mk=monthKey(),m=(missions[mk]||[]).find(x=>x.id===mm.mission.id);
        if(m){m.score=+document.getElementById('modal-score').value;m.completed=true;m.scoredBy=state.user.name;m.seenByEmployee=false}
        saveAll();state.modal=null;render();showToast('تم حفظ التقييم ✓');
      });
    } else if(mm.type==='emp-upload-photo'){
      document.getElementById('modal-save-emp-photo')?.addEventListener('click',async()=>{
        if(!_pendingImg){showToast('لم يتم اختيار صورة بعد','error');return}
        const saveBtn=document.getElementById('modal-save-emp-photo'),mk=monthKey(),missionId=saveBtn.dataset.missionId,m=empMissions(state.user.empId,mk).find(x=>x.id===missionId);
        if(!m)return;
        const img=_pendingImg;
        if(isStaff()){m.employeeImageData=img;saveAll()}
        else{saveBtn.disabled=true;saveBtn.textContent='⏳ جاري الرفع…';const{error}=await sb.rpc('emp_mission_action',{p_mk:mk,p_id:missionId,p_action:'photo',p_img:img});if(error){saveBtn.disabled=false;saveBtn.textContent='💾 حفظ الصورة';showToast(errMsg(error),'error');return}m.employeeImageData=img}
        state.modal=null;_pendingImg=null;render();showToast('تم رفع الصورة بنجاح ✓');
      });
    } else if(mm.type==='send-msg'){
      document.getElementById('modal-save')?.addEventListener('click',()=>{
        const to=document.getElementById('modal-emp').value,type=document.getElementById('modal-type').value,body=document.getElementById('modal-body').value,date=new Date().toLocaleDateString('ar-EG');
        if(to==='all')employees.forEach(e=>messages.push({to:e.id,type,body,date,read:false}));
        else messages.push({to,type,body,date,read:false});
        saveAll();state.modal=null;render();showToast('تم الإرسال ✓');
      });
    } else if(mm.type==='edit-emp'){
      document.getElementById('modal-save-emp')?.addEventListener('click',()=>{
        const emp=employees.find(e=>e.id===mm.emp.id);
        emp.name=document.getElementById('emp-name').value;emp.role=document.getElementById('emp-role').value;emp.hourRate=+document.getElementById('emp-hourrate').value;emp.commPct=+document.getElementById('emp-commpct').value;emp.shift=document.getElementById('emp-shift').value;emp.scheduledTime=document.getElementById('emp-schedtime').value;emp.fixedBonus=+document.getElementById('emp-fixedbonus').value||0;emp.bonusName=document.getElementById('emp-bonusname').value;
        saveAll();state.modal=null;render();showToast('تم حفظ بيانات الموظف ✓');
      });
    } else if(mm.type==='edit-user'||mm.type==='add-user'){
      document.getElementById('gen-pass-btn')?.addEventListener('click',()=>{document.getElementById('user-newpass').value=genPassword()});
      document.getElementById('modal-save-user')?.addEventListener('click',async()=>{
        const isNew=mm.type==='add-user',errEl=document.getElementById('user-edit-err'),btn=document.getElementById('modal-save-user');
        const newU=document.getElementById('user-username').value.trim().toLowerCase(),newN=document.getElementById('user-display-name').value.trim(),newP=document.getElementById('user-newpass').value.trim();
        const role=document.getElementById('user-role').value,empId=document.getElementById('user-emp').value||null;
        if(!/^[a-z0-9._-]{3,30}$/.test(newU)){errEl.textContent=ERR_AR.invalid_username;return}
        if((isNew||newP)&&newP.length<6){errEl.textContent=ERR_AR.password_too_short;return}
        if(users.some(u=>u.username===newU&&(isNew||u.id!==mm.user.id))){errEl.textContent=ERR_AR.username_taken;return}
        if(role!=='owner'&&!empId&&!confirm('هذا الحساب غير مرتبط بموظف — لن يرى بيانات أداء. متابعة؟'))return;
        btn.disabled=true;errEl.textContent='';
        try{
          if(isNew){
            const pages=role==='owner'?OWNER_PAGES:role==='senior'?SENIOR_PAGES:EMP_PAGES;
            const{error}=await sb.rpc('admin_create_user',{p_username:newU,p_password:newP,p_name:newN||newU,p_role:role,p_emp_id:empId,p_pages:pages});
            if(error)throw error;
            await loadUsers();
            state.modal={type:'credentials',list:[{name:newN||newU,username:newU,password:newP}]};render();
            return;
          }
          const u=mm.user;
          if(newU!==u.username){const{error}=await sb.rpc('admin_set_username',{p_uid:u.id,p_username:newU});if(error)throw error}
          if(newP){const{error}=await sb.rpc('admin_set_password',{p_uid:u.id,p_password:newP});if(error)throw error}
          const upd={name:newN||newU,emp_id:empId};
          if(u.id!==state.user.id)upd.role=role;
          if(upd.role&&upd.role!==u.role)upd.pages=upd.role==='owner'?OWNER_PAGES:upd.role==='senior'?SENIOR_PAGES:EMP_PAGES;
          const{error}=await sb.from('profiles').update(upd).eq('id',u.id);if(error)throw error;
          await loadUsers();
          if(u.id===state.user.id){const me=users.find(x=>x.id===u.id);if(me)Object.assign(state.user,me)}
          state.modal=newP?{type:'credentials',list:[{name:newN||newU,username:newU,password:newP}]}:null;
          render();showToast('تم حفظ بيانات المستخدم ✓');
        }catch(e){btn.disabled=false;errEl.textContent=errMsg(e)}
      });
    } else if(mm.type==='credentials'){
      document.getElementById('copy-creds-btn')?.addEventListener('click',()=>{
        const txt=mm.list.filter(c=>!c.error).map(c=>`${c.name}\t${c.username}\t${c.password}`).join('\n')+`\n\n${location.origin+location.pathname}`;
        navigator.clipboard.writeText(txt).then(()=>showToast('تم النسخ ✓'),()=>showToast('تعذّر النسخ — استخدم الطباعة','error'));
      });
      document.getElementById('print-creds-btn')?.addEventListener('click',()=>{
        const w=window.open('','_blank');if(!w){showToast('اسمح بالنوافذ المنبثقة للطباعة','error');return}
        w.document.write(`<html dir="rtl"><head><meta charset="utf-8"><title>بيانات الدخول</title><style>body{font-family:sans-serif;padding:24px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:8px;text-align:right}td.l{direction:ltr;font-family:monospace;text-align:left}</style></head><body><h2>بيانات الدخول — مجموعة الكريم</h2><p>الرابط: ${esc(location.origin+location.pathname)}</p><table><tr><th>الاسم</th><th>اسم المستخدم</th><th>كلمة المرور</th></tr>${mm.list.filter(c=>!c.error).map(c=>`<tr><td>${esc(c.name)}</td><td class="l">${esc(c.username)}</td><td class="l">${esc(c.password)}</td></tr>`).join('')}</table></body></html>`);
        w.document.close();w.focus();w.print();
      });
    } else if(mm.type==='edit-perms'){
      document.querySelectorAll('.perm-cb').forEach(cb=>{cb.addEventListener('change',()=>{cb.closest('label').classList.toggle('on',cb.checked)})});
      document.getElementById('perm-all')?.addEventListener('click',()=>{document.querySelectorAll('.perm-cb').forEach(cb=>{cb.checked=true;cb.closest('label').classList.add('on')})});
      document.getElementById('perm-none')?.addEventListener('click',()=>{document.querySelectorAll('.perm-cb').forEach(cb=>{cb.checked=false;cb.closest('label').classList.remove('on')})});
      document.getElementById('modal-save-perms')?.addEventListener('click',async()=>{
        const u=mm.user,selected=[];
        document.querySelectorAll('.perm-cb:checked').forEach(cb=>selected.push(cb.dataset.page));
        const{error}=await sb.from('profiles').update({pages:selected}).eq('id',u.id);
        if(error){showToast(errMsg(error),'error');return}
        await loadUsers();if(u.id===state.user.id)state.user.pages=selected;
        state.modal=null;render();showToast('تم حفظ الصلاحيات ✓');
      });
    }
  }
}

// ══════════════════════════════════════════════
//  IMAGE HELPER
// ══════════════════════════════════════════════
function bindImgInput(inputId,previewId,target){
  const imgInput=document.getElementById(inputId);
  if(!imgInput)return;
  imgInput.addEventListener('change',e=>{const f=e.target.files[0];if(f)loadImg(f,previewId)});
}
function loadImg(file,previewId){
  if(file.size>15*1024*1024){showToast('الصورة أكبر من 15MB','error');return}
  const img=new Image(),objUrl=URL.createObjectURL(file);
  img.onload=function(){
    URL.revokeObjectURL(objUrl);
    const MAX=1400;let w=img.width,h=img.height;
    if(w>MAX){h=Math.round(h*MAX/w);w=MAX}
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    const dataUrl=canvas.toDataURL('image/jpeg',0.82);
    _pendingImg=dataUrl;
    const wrap=document.getElementById(previewId);
    if(wrap)wrap.innerHTML=`<img src="${dataUrl}" style="width:100%;max-height:180px;object-fit:cover;border-radius:8px"><div style="font-size:12px;color:var(--success);margin-top:6px;font-weight:700">✅ تم تحميل الصورة — اضغط حفظ</div>`;
  };
  img.src=objUrl;
}

// ══════════════════════════════════════════════
//  BULK ACCOUNT CREATION (owner)
// ══════════════════════════════════════════════
async function bulkCreateAccounts(){
  const taken=new Set(users.map(u=>u.username)),linked=new Set(users.map(u=>u.empId).filter(Boolean));
  const todo=[];
  USERS_DEFAULT.forEach(d=>{
    if(taken.has(d.username))return;
    if(d.empId&&(!employees.some(e=>e.id===d.empId)||linked.has(d.empId)))return;
    const emp=employees.find(e=>e.id===d.empId);
    todo.push({...d,name:emp?emp.name:d.name});taken.add(d.username);if(d.empId)linked.add(d.empId);
  });
  employees.filter(e=>!linked.has(e.id)).forEach(e=>{
    let un=e.id.toLowerCase();while(taken.has(un))un+='x';
    todo.push({username:un,role:'employee',empId:e.id,name:e.name,pages:EMP_PAGES});taken.add(un);linked.add(e.id);
  });
  if(!todo.length){showToast('كل الموظفين لديهم حسابات بالفعل ✓','info');return}
  if(!confirm(`سيتم إنشاء ${todo.length} حساب بكلمات مرور عشوائية:\n\n${todo.map(t=>`• ${t.name} — ${t.username}`).join('\n')}\n\nمتابعة؟`))return;
  showToast('⏳ جاري إنشاء الحسابات…','info');
  const list=[];
  for(const t of todo){
    const pw=genPassword();
    const{error}=await sb.rpc('admin_create_user',{p_username:t.username,p_password:pw,p_name:t.name,p_role:t.role,p_emp_id:t.empId,p_pages:t.pages});
    list.push({name:t.name,username:t.username,password:pw,error:error?errMsg(error):null});
  }
  await loadUsers();
  state.modal={type:'credentials',list};render();
}

// ══════════════════════════════════════════════
//  STARTUP
// ══════════════════════════════════════════════
(async function startup(){
  resetData();
  if(!window.supabase||!initSupabase()){
    document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="login-card" style="text-align:center"><div style="font-size:40px;margin-bottom:10px">📡</div><h3 style="margin-bottom:8px">تعذّر الاتصال</h3><p style="color:var(--text2);font-size:13px">تحقق من اتصال الإنترنت ثم أعد تحميل الصفحة.</p></div></div>`;
    return;
  }
  const{data:{session}}=await sb.auth.getSession();
  if(session){
    state.loading=true;render();
    try{await afterLogin(session)}catch(e){console.error(e);await sb.auth.signOut().catch(()=>{});state.loginError=e.message==='no_profile'?'هذا الحساب غير مفعّل — تواصل مع المالك':''}
    state.loading=false;
  }
  render();
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&state.loggedIn)logoutLocal()});
})();
</script>
